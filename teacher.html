<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f6ebdc" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>致恩师 · 教师节快乐</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Caveat:wght@400;500;600;700&family=Italiana&family=DM+Mono:wght@300;400&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Liu+Jian+Mao+Cao&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer/dist/APlayer.min.css" />

<style>
  :root {
    /* Default: Rose & Honey */
    --bg-1: #f6ebdc;
    --bg-2: #efd9c4;
    --bg-3: #e5b89a;
    --paper: #fbf3e4;
    --paper-edge: #e9d6b6;
    --ink: #4a2a2a;
    --ink-soft: #7a4a44;
    --accent: #b8546a;
    --accent-soft: #d98a96;
    --gold: #c69a5b;
    --shadow: 60, 30, 30;
    --particle-1: #e0a4ad;
    --particle-2: #f3c6a9;
    --particle-3: #c69a5b;
    --vignette: 80, 40, 30;
    --glow: 240, 200, 170;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    height: 100vh;
    font-family: 'Noto Serif SC', 'Cormorant Garamond', 'Times New Roman', serif;
    color: var(--ink);
    background: var(--bg-1);
    overflow: hidden; /* no scroll */
    transition: background 1.4s ease, color 1.4s ease;
    -webkit-font-smoothing: antialiased;
  }

  /* The breathing background gradient */
  .stage {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 30% 20%, var(--bg-2) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 90%, var(--bg-3) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    transition: background 1.4s ease;
    animation: breathe 14s ease-in-out infinite;
  }
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(var(--vignette), 0.35) 100%);
    pointer-events: none;
    transition: background 1.4s ease;
  }
  @keyframes breathe {
    0%, 100% { filter: brightness(1) saturate(1); }
    50% { filter: brightness(1.05) saturate(1.08); }
  }

  /* Subtle paper grain across whole page */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.18;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='5'/><feColorMatrix values='0 0 0 0 0.3 0 0 0 0 0.2 0 0 0 0 0.2 0 0 0 0.6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* Floating particles container — above the ground so falls land in view */
  .particles {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    will-change: transform, opacity;
    opacity: 0;
    animation-name: drift;
    animation-iteration-count: infinite;
    animation-timing-function: linear;
  }
  @keyframes drift {
    /* fall from above the viewport and land at a per-particle random spot inside the grass-strip;
       fill-mode:forwards on each particle keeps it parked there permanently */
    0%   { transform: translate3d(var(--dx0,0), -10vh, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: var(--maxop, 0.85); }
    55%  { transform: translate3d(calc(var(--dx0,0) + var(--sway,40px)), calc(var(--landY, 96vh) * 0.6), 0) rotate(180deg); opacity: var(--maxop, 0.85); }
    100% { transform: translate3d(calc(var(--dx0,0) + var(--sway,40px) * 0.5), var(--landY, 96vh), 0) rotate(360deg); opacity: var(--maxop, 0.85); }
  }

  /* Theme switcher */
  .switcher {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 999px;
    box-shadow: 0 6px 28px rgba(var(--shadow), 0.18);
    transition: background 1.2s ease, border-color 1.2s ease, box-shadow 1.2s ease;
  }
  .switcher .label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-right: 4px;
    opacity: 0.8;
    transition: color 1s ease;
  }
  .swatch {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.7);
    box-shadow: 0 2px 10px rgba(var(--shadow), 0.18), inset 0 0 0 1px rgba(0,0,0,0.05);
    transition: transform 0.4s cubic-bezier(.2,.9,.3,1.4), box-shadow 0.4s ease, border-color 0.4s ease;
    position: relative;
  }
  .swatch:hover { transform: scale(1.18); }
  .swatch.active {
    transform: scale(1.25);
    border-color: var(--paper);
    box-shadow: 0 0 0 2px var(--accent), 0 4px 14px rgba(var(--shadow), 0.25);
  }
  .swatch[data-theme="rose"]      { background: linear-gradient(135deg, #f6ebdc 0%, #b8546a 100%); }
  .swatch[data-theme="lavender"]  { background: linear-gradient(135deg, #e9def0 0%, #7a5b8f 100%); }
  .swatch[data-theme="sakura"]    { background: linear-gradient(135deg, #fde6ec 0%, #e58aa6 100%); }
  .swatch[data-theme="midnight"]  { background: linear-gradient(135deg, #1d243d 0%, #d4ad58 100%); }
  .swatch[data-theme="sage"]      { background: linear-gradient(135deg, #e8eadd 0%, #8aa07a 100%); }

  /* Top-right controls */
  .top-right {
    position: fixed;
    top: 28px;
    right: 28px;
    z-index: 30;
    display: flex;
    gap: 10px;
  }
  .pill-btn {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: rgba(255,255,255,0.35);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    border: 1px solid rgba(255,255,255,0.45);
    padding: 9px 13px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 28px rgba(var(--shadow), 0.18);
    transition: all 0.4s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .pill-btn:hover { transform: translateY(-1px); color: var(--accent); }
  .pill-btn .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    transition: background 0.4s ease;
  }
  .pill-btn.off .dot { background: var(--ink-soft); box-shadow: none; opacity: 0.5; }

  /* Main scene — single screen, centered, no scroll */
  .scene {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: grid;
    place-items: center;
    padding: 72px 20px 160px; /* room for top switcher + bottom ground */
    overflow: hidden;
  }

  /* === Envelope (cover) === */
  .envelope-wrap {
    perspective: 1400px;
    width: min(520px, 86vw);
    aspect-ratio: 7 / 5;
    position: relative;
    cursor: pointer;
    transition: transform 0.7s cubic-bezier(.4,.1,.2,1), opacity 0.8s ease;
  }
  .envelope-wrap.hidden { opacity: 0; pointer-events: none; transform: scale(0.92) translateY(-30px); position: absolute; }
  .envelope-wrap:hover .seal-hint { opacity: 1; transform: translate(-50%, 18px); }

  .envelope {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }
  .env-body {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(135deg, var(--paper) 0%, var(--paper-edge) 100%);
    border: 1px solid color-mix(in oklab, var(--paper-edge), var(--ink) 18%);
    border-radius: 4px;
    box-shadow:
      0 30px 60px -20px rgba(var(--shadow), 0.45),
      0 12px 28px -10px rgba(var(--shadow), 0.3),
      inset 0 0 0 8px var(--paper),
      inset 0 0 0 9px color-mix(in oklab, var(--paper-edge), var(--ink) 25%);
    overflow: hidden;
  }
  .env-body::before, .env-body::after {
    content: "";
    position: absolute;
    background: color-mix(in oklab, var(--paper-edge), var(--ink) 8%);
  }
  .env-body::before {
    inset: 0;
    background:
      linear-gradient(135deg, transparent calc(50% - 1px), color-mix(in oklab, var(--paper-edge), var(--ink) 22%) 50%, transparent calc(50% + 1px)) no-repeat,
      linear-gradient(-135deg, transparent calc(50% - 1px), color-mix(in oklab, var(--paper-edge), var(--ink) 22%) 50%, transparent calc(50% + 1px)) no-repeat;
    background-size: 100% 50%, 100% 50%;
    background-position: top, top;
  }
  .env-body::after {
    inset: 0;
    background:
      linear-gradient(45deg, transparent calc(50% - 1px), color-mix(in oklab, var(--paper-edge), var(--ink) 22%) 50%, transparent calc(50% + 1px)) no-repeat;
    background-size: 100% 50%;
    background-position: bottom;
    opacity: 0.5;
  }

  .env-flap {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 50%;
    background: linear-gradient(180deg, var(--paper) 0%, color-mix(in oklab, var(--paper-edge), var(--ink) 6%) 100%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform 1.2s cubic-bezier(.5,.05,.2,1);
    box-shadow: 0 4px 8px rgba(var(--shadow), 0.1);
    z-index: 4;
  }
  .envelope-wrap.opening .env-flap { transform: rotateX(-180deg); }
  .envelope-wrap:hover .env-flap { transform: rotateX(-12deg); }
  .envelope-wrap.opening:hover .env-flap { transform: rotateX(-180deg); }

  .seal {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(1);
    width: 84px; height: 84px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, color-mix(in oklab, var(--accent), white 30%) 0%, var(--accent) 45%, color-mix(in oklab, var(--accent), black 30%) 100%);
    box-shadow:
      0 6px 16px rgba(var(--shadow), 0.4),
      inset 0 -3px 6px rgba(0,0,0,0.25),
      inset 0 3px 6px rgba(255,255,255,0.25);
    z-index: 6;
    display: grid;
    place-items: center;
    font-family: 'Italiana', serif;
    font-size: 30px;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.05em;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    transition: transform 0.8s cubic-bezier(.4,.1,.2,1), opacity 0.6s ease;
    cursor: pointer;
  }
  .envelope-wrap.opening .seal { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
  .seal::before {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
    opacity: 0.5;
    z-index: -1;
    animation: sealPulse 3.5s ease-in-out infinite;
  }
  @keyframes sealPulse { 0%, 100% { transform: scale(1); opacity: 0.4; } 50% { transform: scale(1.3); opacity: 0.6; } }

  .env-text {
    position: absolute;
    left: 50%;
    top: 28%;
    transform: translateX(-50%);
    font-family: 'Liu Jian Mao Cao', 'Caveat', cursive;
    font-size: 26px;
    color: var(--ink-soft);
    z-index: 3;
    opacity: 0.92;
    white-space: nowrap;
    letter-spacing: 0.08em;
  }
  .env-text small {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.32em;
    margin-top: 6px;
    opacity: 0.6;
    text-transform: uppercase;
  }

  .seal-hint {
    position: absolute;
    left: 50%;
    bottom: -24px;
    transform: translate(-50%, 0);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.6;
    transition: all 0.4s ease;
  }

  /* === Letter (centered, fits one screen) === */
  .letter-wrap {
    width: min(640px, 92vw);
    max-height: calc(100vh - 200px);
    opacity: 0;
    transform: translateY(36px) scale(0.97);
    transition: opacity 1.2s ease 0.4s, transform 1.2s cubic-bezier(.2,.7,.3,1) 0.4s;
    pointer-events: none;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .letter-wrap.visible { opacity: 1; transform: none; pointer-events: auto; }

  .letter {
    width: 100%;
    position: relative;
    background:
      repeating-linear-gradient(0deg, transparent 0 30px, rgba(var(--shadow),0.04) 30px 31px),
      linear-gradient(180deg, var(--paper) 0%, color-mix(in oklab, var(--paper), var(--paper-edge) 35%) 100%);
    border-radius: 3px;
    padding: 34px 44px 26px;
    box-shadow:
      0 50px 80px -30px rgba(var(--shadow), 0.5),
      0 20px 40px -15px rgba(var(--shadow), 0.3),
      inset 0 0 0 1px color-mix(in oklab, var(--paper-edge), var(--ink) 12%);
    color: var(--ink);
    cursor: pointer;
  }
  .letter-text, .letter-text-bottom {
    transition: opacity 0.32s ease, transform 0.32s ease, filter 0.32s ease;
  }
  .letter.flipping .letter-text,
  .letter.flipping .letter-text-bottom {
    opacity: 0;
    transform: translateY(8px);
    filter: blur(2px);
  }
  .letter-counter {
    font-family: 'DM Mono', monospace !important;
    font-size: 9px;
    letter-spacing: 0.22em;
    color: var(--accent);
    opacity: 0.7;
    text-transform: uppercase;
  }
  .letter::after,
  .letter::before { pointer-events: none; }
  /* torn/uneven top */
  .letter::before {
    content: "";
    position: absolute;
    left: 0; right: 0; top: -1px;
    height: 8px;
    background: var(--paper);
    clip-path: polygon(0 100%, 3% 30%, 7% 80%, 12% 20%, 17% 70%, 22% 30%, 28% 80%, 33% 20%, 39% 70%, 45% 25%, 51% 80%, 57% 25%, 63% 70%, 69% 30%, 75% 80%, 81% 25%, 87% 70%, 92% 30%, 97% 80%, 100% 30%, 100% 100%);
  }
  .letter::after {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 2px;
    pointer-events: none;
    box-shadow: inset 0 0 80px rgba(var(--glow), 0.25);
  }

  .letter .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 18px;
    opacity: 0.75;
  }
  .letter .meta .from-tag {
    font-family: 'Liu Jian Mao Cao', 'Caveat', cursive;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: none;
    color: var(--accent);
    opacity: 0.85;
  }
  .letter h1 {
    font-family: 'Italiana', 'Ma Shan Zheng', serif;
    font-weight: 400;
    font-size: clamp(24px, 3vw, 32px);
    margin: 0 0 2px;
    color: var(--accent);
    letter-spacing: 0.04em;
    line-height: 1.1;
    text-align: center;
  }
  .letter h1 .zh {
    display: block;
    font-family: 'Ma Shan Zheng', 'Noto Serif SC', serif;
    font-size: 0.62em;
    color: var(--ink-soft);
    margin-top: 4px;
    letter-spacing: 0.18em;
    opacity: 0.8;
  }
  .letter .salutation {
    font-family: 'Ma Shan Zheng', 'Liu Jian Mao Cao', cursive;
    font-size: clamp(20px, 2.4vw, 24px);
    color: var(--ink);
    margin: 18px 0 12px;
    line-height: 1.2;
  }
  .letter p {
    font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
    font-size: clamp(13px, 1.05vw, 15.5px);
    line-height: 1.85;
    margin: 0 0 10px;
    color: var(--ink);
    text-wrap: pretty;
    text-indent: 2em;
  }
  .letter p.no-indent { text-indent: 0; }
  .letter p .accent {
    color: var(--accent);
    font-weight: 500;
  }
  .letter .question {
    text-align: center;
    margin: 18px 0 6px;
    font-family: 'Ma Shan Zheng', 'Noto Serif SC', serif;
    font-size: clamp(20px, 2.2vw, 26px);
    color: var(--accent);
    letter-spacing: 0.06em;
    line-height: 1.4;
  }
  .letter .whisper {
    font-family: 'Liu Jian Mao Cao', 'Caveat', cursive;
    font-size: clamp(15px, 1.3vw, 17px);
    color: var(--ink-soft);
    text-align: center;
    margin: 4px 0 10px;
    letter-spacing: 0.04em;
    line-height: 1.5;
  }

  .letter .signoff {
    margin-top: 14px;
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(13px, 1.05vw, 15px);
    color: var(--ink-soft);
    text-align: right;
  }
  .letter .signature {
    font-family: 'Liu Jian Mao Cao', 'Caveat', cursive;
    font-size: clamp(28px, 3.2vw, 38px);
    color: var(--accent);
    line-height: 1;
    margin-top: 4px;
    transform: rotate(-3deg);
    display: inline-block;
  }

  /* Music player slot — embedded inside the letter */
  .music-slot {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed color-mix(in oklab, var(--paper-edge), var(--ink) 22%);
    position: relative;
  }
  .music-slot::before {
    content: "♪";
    position: absolute;
    top: -11px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--paper);
    color: var(--accent);
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 13px;
    font-family: 'Italiana', serif;
    box-shadow: 0 0 0 1px color-mix(in oklab, var(--paper-edge), var(--ink) 20%);
  }

  /* APlayer cosmetic overrides to match romantic aesthetic */
  .music-slot .aplayer {
    margin: 0;
    border-radius: 10px !important;
    overflow: hidden;
    background: rgba(255,255,255,0.55) !important;
    backdrop-filter: blur(10px) saturate(1.1);
    -webkit-backdrop-filter: blur(10px) saturate(1.1);
    box-shadow: 0 8px 22px rgba(var(--shadow), 0.18) !important;
    border: 1px solid color-mix(in oklab, var(--paper-edge), var(--ink) 8%);
    font-family: 'Noto Serif SC', 'Cormorant Garamond', serif !important;
  }
  .music-slot .aplayer .aplayer-info { border-bottom: none !important; }
  .music-slot .aplayer .aplayer-title { color: var(--ink) !important; }
  .music-slot .aplayer .aplayer-author { color: var(--ink-soft) !important; }
  .music-slot .aplayer .aplayer-bar { background: rgba(var(--shadow), 0.12) !important; }
  /* Treat playlists as a single-song player: hide the list drawer entirely */
  .music-slot .aplayer .aplayer-list,
  .music-slot .aplayer .aplayer-list-wrap { display: none !important; height: 0 !important; }
  .music-slot .aplayer .aplayer-icon-menu { display: none !important; }
  .music-slot .aplayer.aplayer-withlist { padding-bottom: 0 !important; }

  /* Custom "next" arrow tucked into the player on the right */
  .music-next {
    position: absolute;
    right: 8px;
    top: calc(50% + 7px); /* compensate for slot's padding-top so we center on the player */
    transform: translateY(-50%);
    z-index: 5;
    width: 30px;
    height: 30px;
    padding: 0;
    border-radius: 50%;
    color: var(--ink-soft);
    background: rgba(255,255,255,0.65);
    border: 1px solid color-mix(in oklab, var(--paper-edge), var(--ink) 18%);
    cursor: pointer;
    display: grid;
    place-items: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 2px 8px rgba(var(--shadow), 0.18);
    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
  }
  .music-next svg {
    width: 14px;
    height: 14px;
    display: block;
    /* Optical centering — chevron pointing right reads better nudged a hair right */
    transform: translateX(1px);
  }
  .music-next[hidden] { display: none; }
  .music-next:hover {
    background: var(--accent);
    color: var(--paper);
    border-color: var(--accent);
    transform: translateY(-50%) scale(1.08);
  }
  .music-next:active { transform: translateY(-50%) scale(0.94); }
  body[data-theme="midnight"] .music-next {
    background: rgba(255,255,255,0.12);
    color: var(--accent-soft);
    border-color: rgba(255,255,255,0.22);
  }
  body[data-theme="midnight"] .music-slot .aplayer {
    background: rgba(20,20,40,0.55) !important;
    color: var(--paper);
  }
  body[data-theme="midnight"] .music-slot .aplayer .aplayer-title { color: var(--paper) !important; }

     Separators:
       ~~~  between letters
       ::   between fields:  title :: subtitle :: paragraphs :: bridge :: question :: whisper
       ||   between paragraphs (newline also works)
     All fields are optional; trailing ones may be omitted.
     If the content contains no "::", the whole value is treated as a single
     letter's body (paragraphs split by || / newline). This makes the short form
     ?content=Dear%20Teacher%20||Thank%20you just work.

  const rawContent = urlParams.get('content');
  function parseCustomLetters(raw) {
    if (!raw) return null;
    const letters = raw.split('~~~').map(s => s.trim()).filter(Boolean);
    if (!letters.length) return null;

    const splitParas = str => (str || '')
      .split(/\|\||\r?\n/)
      .map(s => s.trim())
      .filter(Boolean);

    return letters.map(letterStr => {
      // Short form: no "::" → treat whole string as paragraphs of one letter.
      if (!letterStr.includes('::')) {
        return {
          title: (userTitle || LETTERS[lang][0].title),
          subtitle: '',
          paragraphs: splitParas(letterStr),
          bridge: '',
          question: '',
          whisper: ''
        };
      }
      const [title = '', subtitle = '', paragraphs = '', bridge = '', question = '', whisper = ''] =
        letterStr.split('::');
      return {
        title: title.trim() || 'Dear Teacher',
        subtitle: subtitle.trim(),
        paragraphs: splitParas(paragraphs),
        bridge: bridge.trim(),
        question: question.trim(),
        whisper: whisper.trim()
      };
    }).filter(L => L.paragraphs.length || L.question || L.whisper || L.subtitle);

      if (kind === 'snow') {
        const r = Math.random();
        snowVariant = r < 0.45 ? 0 : r < 0.8 ? 1 : 2;
      }

      const w = (kind === 'rain' && !isPetalInRain) ? 1.6 + Math.random() * 1.0 : 0;
      const h = (kind === 'rain' && !isPetalInRain) ? 22 + Math.random() * 24 : 0;
      const size = isPetalInRain      ? 10 + Math.random() * 8
                  : kind === 'rain'   ? 0
                  : kind === 'snow'   ? (snowVariant === 2 ? 5 + Math.random() * 4
                                       : snowVariant === 1 ? 9 + Math.random() * 6
                                       :                     12 + Math.random() * 8)
                  : kind === 'leaf'   ? 18 + Math.random() * 22
                  :                     14 + Math.random() * 18;

      const color = isPetalInRain
        ? summerPetalPalette[Math.floor(Math.random() * summerPetalPalette.length)]
        : palette[Math.floor(Math.random() * palette.length)];

      const svg = isPetalInRain    ? blossomSVG(color)
                : kind === 'leaf'  ? leafSVG(color)
                : kind === 'snow'  ? snowSVG(color, snowVariant)
                : kind === 'rain'  ? null  // rain rendered via gradient div, no SVG
                :                    blossomSVG(color);
      if (svg) el.innerHTML = svg;

      const left = Math.random() * 100;
      const landYPx = 4 + Math.random() * 52;
      const landY = `calc(100vh - ${landYPx.toFixed(1)}px)`;

      const dur = isPetalInRain    ? 13 + Math.random() * 8
                : kind === 'rain'  ? 3.6 + Math.random() * 2.4
                : kind === 'leaf'  ? 14 + Math.random() * 10
                : kind === 'snow'  ? (snowVariant === 0 ? 22 + Math.random() * 12
                                    : snowVariant === 1 ? 18 + Math.random() * 10
                                    :                     14 + Math.random() * 8)
                :                    12 + Math.random() * 10;

      // For initial burst, randomize delay across [-2*dur, 0] so the box opens
      // already populated with both landed and in-flight particles. For ongoing
      // spawns, start fresh from the top.
      const startDelay = initial ? -Math.random() * dur * 2 : 0;

      const sway = (kind === 'rain' && !isPetalInRain) ? '40px'
                 : kind === 'snow'                     ? (Math.random() * 320 - 160) + 'px'
                 :                                       (Math.random() * 240 - 120) + 'px';
      const opacity = isPetalInRain    ? 0.6 + Math.random() * 0.3
                    : kind === 'rain'  ? 0.55 + Math.random() * 0.35
                    : kind === 'snow'  ? (snowVariant === 2 ? 0.5 + Math.random() * 0.3
                                                            : 0.7 + Math.random() * 0.3)
                    :                    0.55 + Math.random() * 0.4;

      if (kind === 'rain' && !isPetalInRain) {
        el.style.cssText = `
          left:${left}vw;
          top:0;
          width:${w}px;
          height:${h}px;
          animation-name:rainfall;
          animation-duration:${dur}s;
          animation-delay:${startDelay}s;
          animation-timing-function:linear;
          animation-iteration-count:1;
          animation-fill-mode:forwards;
          --landY:${landY};
          opacity:${opacity};
          background: linear-gradient(180deg, transparent 0%, ${color} 70%, ${color} 100%);
          border-radius: ${w}px;
          box-shadow: 0 0 3px ${color};
          transform: rotate(6deg);
          filter: blur(0.25px);
        `;
      } else {
        el.style.cssText = `
          left:${left}vw;
          top:0;
          width:${size}px;
          height:${size}px;
          animation-duration:${dur}s;
          animation-delay:${startDelay}s;
          animation-iteration-count:1;
          animation-fill-mode:forwards;
          --sway:${sway};
          --dx0:0px;
          --landY:${landY};
          --maxop:${opacity};
        `;
      }

      // No eviction — landed particles stay forever. The spawner stops once the cap is hit.
      while (particlesEl.children.length >= 180) particlesEl.firstElementChild.remove();
      particlesEl.appendChild(el);
    }

    // 1) Initial burst — opens with some landed and some still falling
    const initialN = kind === 'rain' ? 70 : 40;
    for (let i = 0; i < initialN; i++) makeOne(true);

    // 2) Continuous spawn — keeps falling forever, particles pile up without limit.
    const interval = kind === 'rain' ? 220 : 850;
    spawnTimer = setInterval(() => makeOne(false), interval);
  }

  const styleSheet = document.createElement('style');
  styleSheet.textContent = `
    @keyframes rainfall {
      /* drops fall, then settle at a random landing Y inside the grass-strip box and stay there */
      0%   { transform: translate(0, -10vh) rotate(6deg); opacity: 0; }
      15%  { opacity: 1; }
      100% { transform: translate(-4vw, var(--landY, 98vh)) rotate(6deg); opacity: 1; }
    }
  `;
  document.head.appendChild(styleSheet);

  petalsBtn.addEventListener('click', () => {
    particlesOn = !particlesOn;
    petalsBtn.classList.toggle('off', !particlesOn);
    petalsBtn.setAttribute('aria-pressed', String(particlesOn));
    rebuildParticles();
  });

  try {
    const saved = localStorage.getItem('teacher-letter-theme');
    if (saved && THEMES[saved]) setTheme(saved);
  } catch(e){}

  rebuildParticles();

  /* ===== Grass blades + seasonal piles ===== */
  const grassEl = document.getElementById('grassStrip');
  const leafPileEl = document.getElementById('leafPile');
  const petalPileEl = document.getElementById('petalPile');
  const puddlePileEl = document.getElementById('puddlePile');
  const snowPileEl  = document.getElementById('snowPile');

  // Smoothly varying density profile across width — gives natural "this side is more piled than that"
  function makeProfile(W) {
    const peaks = 5 + Math.floor(Math.random() * 4);
    const profile = [];
    for (let i = 0; i < peaks; i++) {
      profile.push({
        x: (i + 0.4 + Math.random() * 0.4) * W / peaks,
        h: 0.45 + Math.random() * 0.7
      });
    }
    return profile;
  }
  function densityAt(profile, x) {
    let w = 0, sum = 0;
    for (const p of profile) {
      const wi = 1 / (1 + Math.pow((x - p.x) / 100, 2));
      w += wi;
      sum += p.h * wi;
    }
    return sum / w;
  }

  function buildGrass() {
    if (!grassEl) return;
    const density = SEASONS[currentSeason()].grassDensity;
    const W = window.innerWidth;
    const N = Math.floor(W / 9 * density);
    const cs = getComputedStyle(document.body);
    const g1 = cs.getPropertyValue('--ground-1').trim() || '#7ba869';
    const g2 = cs.getPropertyValue('--ground-2').trim() || '#3e6b32';
    const tip = cs.getPropertyValue('--grass-tip').trim() || g1;
    const bloom = cs.getPropertyValue('--bloom').trim() || '#ec8aa8';
    const season = currentSeason();

    let svg = `<svg viewBox="0 0 ${W} 70" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">`;
    for (let i = 0; i < N; i++) {
      const x = Math.random() * W;
      const h = 18 + Math.random() * 34;
      const lean = (Math.random() - 0.5) * 12;
      const fill = Math.random() < 0.4 ? g1 : g2;
      svg += `<path d="M ${x} 70 Q ${x + lean*0.5} ${70-h*0.6} ${x + lean} ${70-h} Q ${x + lean - 1} ${70-h*0.6} ${x-1.6} 70 Z" fill="${fill}"/>`;
      if (Math.random() < 0.35) {
        svg += `<path d="M ${x + lean*0.7} ${70-h*0.7} L ${x+lean} ${70-h}" stroke="${tip}" stroke-width="0.8" fill="none" opacity="0.6"/>`;
      }
      if ((season === 'spring' || season === 'summer') && Math.random() < 0.04) {
        const fy = 70 - h - 2;
        svg += `<g transform="translate(${x+lean} ${fy})">`;
        for (let p = 0; p < 5; p++) {
          svg += `<circle cx="${Math.cos(p*1.2566)*2.2}" cy="${Math.sin(p*1.2566)*2.2}" r="1.6" fill="${bloom}" opacity="0.95"/>`;
        }
        svg += `<circle r="1" fill="#fff3a8"/></g>`;
      }
    }
    svg += `</svg>`;
    grassEl.innerHTML = svg;
  }

  function buildLeafPile() {
    if (!leafPileEl) return;
    const W = window.innerWidth;
    const colors = ['#c8602e','#e08a3a','#a84a22','#d97a2e','#8a4520','#e8a84a'];
    const profile = makeProfile(W);
    let svg = `<svg viewBox="0 0 ${W} 60" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">`;

    // 1) Pre-piled base — leaves carpet the bottom
    for (let i = 0; i < W / 6; i++) {
      const x = Math.random() * W;
      const y = 50 + Math.random() * 8;
      const r = 5 + Math.random() * 8;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse cx="0" cy="0" rx="${r*1.3}" ry="${r*0.65}" fill="${c}"/><line x1="${-r*1.2}" y1="0" x2="${r*1.2}" y2="0" stroke="rgba(0,0,0,0.25)" stroke-width="0.7"/></g>`;
    }
    // 2) Accumulated layer — heavier where the profile peaks
    for (let i = 0; i < W / 10; i++) {
      const x = Math.random() * W;
      const dens = densityAt(profile, x);
      if (Math.random() > dens) continue;
      const y = 44 - 12 * dens + Math.random() * 6;
      const r = 5 + Math.random() * 7;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse cx="0" cy="0" rx="${r*1.3}" ry="${r*0.6}" fill="${c}" opacity="0.9"/><line x1="${-r*1.2}" y1="0" x2="${r*1.2}" y2="0" stroke="rgba(0,0,0,0.2)" stroke-width="0.6"/></g>`;
    }
    // 3) Random leaves caught on grass blades
    for (let i = 0; i < W / 26; i++) {
      const x = Math.random() * W;
      const y = 10 + Math.random() * 24;
      const r = 4 + Math.random() * 5;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse cx="0" cy="0" rx="${r*1.3}" ry="${r*0.55}" fill="${c}" opacity="0.85"/><line x1="${-r*1.2}" y1="0" x2="${r*1.2}" y2="0" stroke="rgba(0,0,0,0.2)" stroke-width="0.5"/></g>`;
    }

    svg += `</svg>`;
    leafPileEl.innerHTML = svg;
  }

  function buildPetalPile() {
    if (!petalPileEl) return;
    const W = window.innerWidth;
    const colors = ['#f7c5d3','#fde0ea','#ffd9e4','#f4a3b6','#e88aa6','#ffe0e8','#ffc0cb'];
    const profile = makeProfile(W);
    let svg = `<svg viewBox="0 0 ${W} 60" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">`;

    // 1) Pre-piled base — always present at the very bottom
    for (let i = 0; i < W / 5; i++) {
      const x = Math.random() * W;
      const y = 50 + Math.random() * 8;
      const r = 2.5 + Math.random() * 3;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<ellipse cx="${x}" cy="${y}" rx="${r * 1.6}" ry="${r * 0.55}" fill="${c}" opacity="${0.8 + Math.random() * 0.2}" transform="rotate(${rot} ${x} ${y})"/>`;
    }
    // 2) Accumulated layer — drifts higher where the profile peaks (looks like falls piled there)
    for (let i = 0; i < W / 8; i++) {
      const x = Math.random() * W;
      const dens = densityAt(profile, x);
      if (Math.random() > dens) continue;
      const y = 44 - 12 * dens + Math.random() * 6;
      const r = 3 + Math.random() * 3;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<ellipse cx="${x}" cy="${y}" rx="${r * 1.5}" ry="${r * 0.55}" fill="${c}" opacity="${0.75 + Math.random() * 0.2}" transform="rotate(${rot} ${x} ${y})"/>`;
    }
    // 3) Hanging on grass — random petals stuck mid-grass
    for (let i = 0; i < W / 26; i++) {
      const x = Math.random() * W;
      const y = 10 + Math.random() * 22;
      const r = 2 + Math.random() * 2;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<ellipse cx="${x}" cy="${y}" rx="${r * 1.4}" ry="${r * 0.5}" fill="${c}" opacity="${0.7 + Math.random() * 0.25}" transform="rotate(${rot} ${x} ${y})"/>`;
    }
    // 4) A few intact 5-petal blossoms scattered on top
    for (let i = 0; i < W / 40; i++) {
      const cx = Math.random() * W;
      const cy = 32 + Math.random() * 18;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<g transform="translate(${cx} ${cy}) rotate(${rot})">`;
      for (let p = 0; p < 5; p++) {
        svg += `<ellipse cx="0" cy="-2.6" rx="1.9" ry="2.9" fill="${c}" opacity="0.95" transform="rotate(${p * 72})"/>`;
      }
      svg += `<circle r="0.9" fill="#fff3a8"/></g>`;
    }

    svg += `</svg>`;
    petalPileEl.innerHTML = svg;
  }

  function buildPuddlePile() {
    if (!puddlePileEl) return;
    const W = window.innerWidth;
    let svg = `<svg viewBox="0 0 ${W} 60" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="puddle-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#a8c8e8" stop-opacity="0"/>
          <stop offset="55%" stop-color="#7ba2c4" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#4f7ea0" stop-opacity="0.85"/>
        </linearGradient>
      </defs>`;
    // Pre-piled wet sheen across the whole strip
    svg += `<rect x="0" y="42" width="${W}" height="18" fill="url(#puddle-grad)" opacity="0.35"/>`;
    // Naturally spaced puddles where rain has collected
    const N = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < N; i++) {
      const cx = (i + 0.5) * W / N + (Math.random() - 0.5) * (W / N) * 0.4;
      const cy = 44 + Math.random() * 10;
      const rx = 70 + Math.random() * 110;
      const ry = 5 + Math.random() * 4;
      svg += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#puddle-grad)" opacity="0.9"/>`;
      svg += `<ellipse cx="${cx - rx * 0.3}" cy="${cy - ry * 0.4}" rx="${rx * 0.4}" ry="${ry * 0.25}" fill="#ffffff" opacity="0.55"/>`;
      svg += `<ellipse cx="${cx + rx * 0.18}" cy="${cy}" rx="${rx * 0.65}" ry="${ry * 0.7}" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.35"/>`;
    }
    // Droplets clinging to grass blades — random "hanging" rain
    for (let i = 0; i < W / 16; i++) {
      const x = Math.random() * W;
      const y = 12 + Math.random() * 26;
      const r = 1.4 + Math.random() * 1.6;
      svg += `<circle cx="${x}" cy="${y}" r="${r}" fill="#7ba2c4" opacity="0.72"/>`;
      svg += `<circle cx="${x - r * 0.3}" cy="${y - r * 0.3}" r="${r * 0.4}" fill="#ffffff" opacity="0.9"/>`;
    }
    svg += `</svg>`;
    puddlePileEl.innerHTML = svg;
  }

  function buildSnowPile() {
    if (!snowPileEl) return;
    const W = window.innerWidth;
    let svg = `<svg viewBox="0 0 ${W} 60" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">`;

    // Just snow caps clinging to grass blades — no bulk drift, so the warm earth shows through
    for (let i = 0; i < W / 12; i++) {
      const x = Math.random() * W;
      const y = 6 + Math.random() * 28;
      const r = 1.6 + Math.random() * 2.2;
      svg += `<ellipse cx="${x}" cy="${y}" rx="${r * 1.3}" ry="${r * 0.7}" fill="#ffffff" opacity="${0.7 + Math.random() * 0.3}"/>`;
    }

    svg += `</svg>`;
    snowPileEl.innerHTML = svg;
  }

  buildGrass();
  buildLeafPile();
  buildPetalPile();
  buildPuddlePile();
  buildSnowPile();
  let _resizeTO;
  window.addEventListener('resize', () => {
    clearTimeout(_resizeTO);
    _resizeTO = setTimeout(() => {
      buildGrass();
      buildLeafPile();
      buildPetalPile();
      buildPuddlePile();
      buildSnowPile();
    }, 200);
  });

  /* ===== Season switching ===== */
  const seasonBtns = document.querySelectorAll('.season-btn');
  function setSeason(s) {
    if (!SEASONS[s]) return;
    body.setAttribute('data-season', s);
    seasonBtns.forEach(b => b.classList.toggle('active', b.dataset.season === s));
    rebuildParticles();
    requestAnimationFrame(() => buildGrass());
    try { localStorage.setItem('teacher-letter-season', s); } catch(e){}
  }
  seasonBtns.forEach(b => b.addEventListener('click', () => setSeason(b.dataset.season)));
  try {
    const savedS = localStorage.getItem('teacher-letter-season');
    if (savedS && SEASONS[savedS]) setSeason(savedS);
    else setSeason('autumn');
  } catch(e){ setSeason('autumn'); }

  /* ===== Ambient hum ===== */
  const muteBtn = document.getElementById('muteBtn');
  let audioCtx = null;
  let masterGain = null;
  let humOn = false;
  let oscNodes = [];

  function startHum() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(audioCtx.destination);
      const freqs = [110, 164.81, 220];
      oscNodes = freqs.map((f, i) => {
        const o = audioCtx.createOscillator();
        o.type = 'sine';
        o.frequency.value = f;
        const g = audioCtx.createGain();
        g.gain.value = 0.06 - i * 0.015;
        o.connect(g).connect(masterGain);
        const lfo = audioCtx.createOscillator();
        lfo.frequency.value = 0.05 + i * 0.03;
        const lfoG = audioCtx.createGain();
        lfoG.gain.value = 1.2;
        lfo.connect(lfoG).connect(o.frequency);
        o.start(); lfo.start();
        return { o, lfo, g };
      });
      masterGain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 2.2);
      humOn = true;
    } catch(e) { console.warn('audio failed', e); }
  }

  function stopHum() {
    if (!audioCtx || !humOn) return;
    masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
    setTimeout(() => {
      oscNodes.forEach(n => { try{ n.o.stop(); n.lfo.stop(); }catch(e){} });
      oscNodes = [];
      humOn = false;
    }, 850);
  }

  muteBtn.addEventListener('click', () => {
    if (humOn) {
      stopHum();
      muteBtn.classList.add('off');
      muteBtn.setAttribute('aria-pressed','false');
    } else {
      startHum();
      muteBtn.classList.remove('off');
      muteBtn.setAttribute('aria-pressed','true');
    }
  });

  /* ===== Heart burst ===== */
  const burstEl = document.getElementById('burst');
  function heartBurst() {
    const SHAPES = ['✧','✦','❀','✿'];
    for (let i = 0; i < 32; i++) {
      const s = document.createElement('span');
      const angle = Math.random() * Math.PI * 2;
      const dist = 140 + Math.random() * 320;
      s.style.setProperty('--bx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--by', Math.sin(angle) * dist + 'px');
      s.style.setProperty('--br', (Math.random() * 360) + 'deg');
      s.style.fontSize = (16 + Math.random() * 24) + 'px';
      s.style.color = getThemeColors()[Math.floor(Math.random()*3)] || 'currentColor';
      s.textContent = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      burstEl.appendChild(s);
      setTimeout(() => s.remove(), 1700);
    }
  }

  /* ===== "Yes" overlay ===== */
  const yesBtn = document.getElementById('yesBtn');
  const yesOverlay = document.getElementById('yesOverlay');
  const yesClose = document.getElementById('yesClose');
  yesBtn.addEventListener('click', () => {
    heartBurst();
    yesOverlay.classList.add('visible');
    yesOverlay.setAttribute('aria-hidden', 'false');
    setTimeout(heartBurst, 600);
    setTimeout(heartBurst, 1200);
  });
  function closeYes() {
    yesOverlay.classList.remove('visible');
    yesOverlay.setAttribute('aria-hidden', 'true');
  }
  yesOverlay.addEventListener('click', closeYes);
  yesClose.addEventListener('click', (e) => { e.stopPropagation(); closeYes(); });

  /* ===== Keyboard: arrow keys cycle themes ===== */
  const order = ['rose','lavender','sakura','midnight','sage'];
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'Escape' && yesOverlay.classList.contains('visible')) { closeYes(); return; }
    const cur = body.getAttribute('data-theme');
    const idx = order.indexOf(cur);
    if (e.key === 'ArrowRight') setTheme(order[(idx+1) % order.length]);
    else if (e.key === 'ArrowLeft') setTheme(order[(idx-1+order.length) % order.length]);
  });
</script>
</body>
</html>
