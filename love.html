      paragraphs: [
        '我曾以为"一见钟情"是诗里的话，是骗人的事。直到那天我看见你——心，确实重重地一下落下来。从此以后，再也没起来。',
        '你转身的弧度，你说话的样子，你抬眼看我那一瞬间的光——像被什么击中，又像是终于回到本该属于的地方。'
      ], bridge: '所以——亲爱的，',
      question: '我心里那一下重重的落地声，<br/>你愿意，再让我听一万次吗？',
      whisper: '你只要在我面前出现一次，<br/>我就要心动一辈子。' },

    { title: 'Carpe Diem', subtitle: '— 致 · 我想认真过的每一个今天 —',
      paragraphs: [
        '时间总是很快，可遇见你之后，我希望它慢一点、再慢一点。慢到我可以仔细看清你的每一道眼神，慢到我可以记住你的每一个早晨。',
        '我想把每一天都过得郑重——因为"明天"是不确定的，但只要"今天"有你在，我就比谁都幸福。'
      ], bridge: '所以——从今天起，',
      question: '你愿意，让每一个"今天"，<br/>都属于我们吗？',
      whisper: '一个又一个的今天，加起来，<br/>就是一辈子。' },

    { title: 'Stelle Cadenti', subtitle: '— 致 · 我偷偷许过千万次的那个愿望 —',
      paragraphs: [
        '小时候看见流星，要赶紧许愿。我许过的愿望有很多，可遇见你之后，我所有的愿望就只剩下一个——希望，遇见的是你；希望，留下的是你。',
        '那一颗坠落的星光里，藏着我最不敢说出口的那句话——而它落下时，你恰好笑了。我便知道，原来天意，是站在我这一边的。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做我此生<br/>不再许第二次的那个愿望吗？',
      whisper: '我愿意，把所有流星<br/>都让给你来许愿。' },

    { title: 'Nostalgie', subtitle: '— 致 · 未来回忆里最好的人 —',
      paragraphs: [
        '我希望多年以后回头看，今天的我们仍然手拉着手；我希望白发苍苍的时候，还能记得现在你看我的眼神。',
        '时间会把所有人变老，但不会把心变旧。我想和你一起老，但不想和你一起冷淡——这一点，我会用一辈子来做到。'
      ], bridge: '所以——亲爱的，',
      question: '几十年之后回头看，你愿意，<br/>仍是我故事里的那个主角吗？',
      whisper: '那时我们都老了，<br/>可你笑起来的样子，一定还和今天一样。' },

    { title: 'Tendresse', subtitle: '— 致 · 心底最柔软的那一处 —',
      paragraphs: [
        '这世上有许多种感情，激烈的、滚烫的、轰轰烈烈的。可我想给你的，是另一种——是细水长流、是温柔托底、是你不必说我也懂。',
        '是你冷的时候，我把外套递给你；是你累的时候，我什么都不问，只是把肩膀给你。'
      ], bridge: '所以——亲爱的，',
      question: '余生这种温柔，<br/>你愿意一直、一直地收下吗？',
      whisper: '我会笨拙一点、慢一点，<br/>但绝不会让你独自挨任何一阵冷风。' },

    { title: 'Soleil et Pluie', subtitle: '— 致 · 阳光与阴雨里的那个人 —',
      paragraphs: [
        '我喜欢你的不只是你笑的样子，我也喜欢你不笑的时候。喜欢你高兴时的明亮，喜欢你沮丧时的沉默；喜欢你的所有面，包括你自己都不喜欢的那一面。',
        '阳光下我陪你笑，阴雨里我替你撑伞。无论是哪一种天气，只要是你，我都愿意。'
      ], bridge: '所以——亲爱的，',
      question: '以后所有的天气，<br/>你愿意，都和我一起过吗？',
      whisper: '晴或雨，由天定；<br/>陪不陪你，由我定——我永远选陪。' },

    { title: 'Un Café Avec Toi', subtitle: '— 致 · 一杯咖啡里都是你 —',
      paragraphs: [
        '我有时会突然想起你，比如早上喝下第一口咖啡的时候。明明苦苦的，可入口的瞬间心里却是甜的——大概，是因为想起了你。',
        '我喜欢和你在一起的那些平淡时刻——什么都不说，只是各自捧一杯咖啡，看窗外的人来人往。生活很慢，可一点也不无聊。'
      ], bridge: '所以——亲爱的，',
      question: '这样平淡的早晨，<br/>你愿意，陪我过一辈子吗？',
      whisper: '我每天都给你做<br/>你最喜欢的那一种。' },

    { title: 'Mille Étoiles', subtitle: '— 致 · 我夜空里数不清的所有星星 —',
      paragraphs: [
        '我曾在很多个夜里，一个人抬头看星空。星星很多，可没有哪一颗是为我亮的。直到遇见你之后我才发现——那一整片星河，原来都是你给我的。',
        '你不必发光，你本身就是光。我所有的迷路、所有的犹豫、所有的不确定，因为你的出现，都被照亮了。'
      ], bridge: '所以——亲爱的，',
      question: '这一片星河，你愿意，<br/>永远落在我头顶吗？',
      whisper: '即使天黑得再深，<br/>只要你抬头，我就一直在那里。' },

    { title: 'Promesse', subtitle: '— 致 · 我用一生兑现的那个承诺 —',
      paragraphs: [
        '我不喜欢轻易许诺，因为承诺一旦说出口，就要用一辈子来兑现。可我愿意，对你说一次。',
        '我承诺，会陪你走过所有平凡的早晨；会接住你所有的眼泪和欢笑；会在你需要的每一个瞬间，准时出现。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做我此生<br/>唯一一次"承诺"的对象吗？',
      whisper: '这一次，我不会再说第二次——<br/>因为你，就是终点。' },

    { title: 'Petite Pluie', subtitle: '— 致 · 所有雨天里都在想的那个人 —',
      paragraphs: [
        '下雨的时候我就会想你。雨声敲在窗上，我听见的不是雨，是你笑的样子。',
        '雨里走过的人很多，但能让我愿意把伞递过去的，只有你；雨里听过的歌很多，但能让我心头一软的，也只有你。'
      ], bridge: '所以——亲爱的，',
      question: '这一生这么多场雨，<br/>你愿意，都和我同撑一把伞吗？',
      whisper: '雨不停，<br/>我也不会松开你的手。' },

    { title: 'Nous Deux', subtitle: '— 致 · 我和你之间无声的默契 —',
      paragraphs: [
        '我喜欢"我和你"之间那种不必说就懂的默契——一个眼神，一句"嗯"，一个回头。这些细小的信号，是别人看不见的，可我们都懂。',
        '这种默契是要时间养出来的——是日复一日的早安、晚安，是无数次"今天怎么样"的关心，是不轰烈但深的爱。'
      ], bridge: '所以——亲爱的，',
      question: '这一生，你愿意，<br/>让我们的默契越来越深吗？',
      whisper: '我想我们老了之后，<br/>连呼吸的频率，都是一样的。' },

    { title: 'Reflets', subtitle: '— 致 · 心里始终倒映着的那个人 —',
      paragraphs: [
        '我曾以为"心里有人"是夸张的说法。直到我心里真的住下了你——做什么事都会想到你，看什么风景都希望你也在。',
        '你像水里的月亮，明明是倒影，却比真实的月亮还要让我着迷。我所有的看见、所有的忽略，最终都回到你的身上。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做我心里<br/>永远倒映的那一弯月光吗？',
      whisper: '即使我醒着，<br/>我心里都在梦你。' },

    { title: 'Vœux', subtitle: '— 致 · 此生最郑重的誓言 —',
      paragraphs: [
        '我会陪你慢慢变老。我会在你皱纹爬上眼角时，仍然觉得你最美。我会在你忘记很多事的时候，仍然记得我们第一次相遇的样子。',
        '我会一直走在你的身侧——不在前，也不在后。你快我快，你慢我慢。永远，永远不让你一个人。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，让我用一生时间，<br/>来兑现这一段誓言吗？',
      whisper: '哪怕老到牵不动了，<br/>我也要握着你的小指。' },

    { title: 'Ondes', subtitle: '— 致 · 心里翻涌着的那阵潮汐 —',
      paragraphs: [
        '你像潮水。你来的时候，我心里所有海岸都被淹没；你不来的时候，我便望着远处的海面，等。',
        '我曾以为爱是平静的，可遇见你之后我才明白——爱也可以是涨潮，是奔涌，是所有平静之下汹涌的暗流。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做我心里<br/>此起彼伏的那片海吗？',
      whisper: '我所有的礁石、所有的沙、所有的退潮——<br/>只为你。' },

    { title: 'Premier Regard', subtitle: '— 致 · 让我世界变安静的人 —',
      paragraphs: [
        '我至今记得遇见你的那一刻——周围所有的声音突然消了下去，时间像是被按了暂停键。世界很大，可我眼里只剩你。',
        '你大概不知道，那一秒钟，我心里几个声音在说话——一个说"是她（他）"，一个说"别错过"，一个说"这一辈子，就她（他）了"。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做我此生<br/>唯一让我"世界变安静"的人吗？',
      whisper: '你来了之后，<br/>连我自己的呼吸都听得见了。' },

    { title: 'La Mer', subtitle: '— 致 · 心底深得像海一样的那份爱 —',
      paragraphs: [
        '海是不会说话的，可它一直在那里。我对你的爱，像海——不喧哗，不夸张，可你只要看一眼，就知道它有多深。',
        '我愿意做你身后那一片海，从来不抢你的光，只在你回头的时候，安静地涌着浪。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，让我做你身后<br/>永远翻涌的那片海吗？',
      whisper: '我不要你时时刻刻看见我，<br/>只要你需要的时候，我都在。' },

    { title: 'Sussurro', subtitle: '— 致 · 心底说了一千遍的那句话 —',
      paragraphs: [
        '我心里有一句话，已经说过一千遍了——只是每次都没敢说出口。它在我嘴边，又溜回我心里；它想出来，又怕惊扰你。',
        '直到今晚，灯影微凉，我终于鼓起勇气，把它放在这里——'
      ], bridge: '所以——',
      question: '"我喜欢你。我爱你。我想嫁/娶你。"<br/>这三句话，你愿意，依次回我吗？',
      whisper: '你只要点一下头，<br/>我就把这一千遍的等待，全部兑现给你。' },

    { title: 'Aurore', subtitle: '— 致 · 每一个清晨我最先想到的人 —',
      paragraphs: [
        '我喜欢清晨。喜欢光从窗帘缝里钻进来的瞬间；喜欢一切都还没开始的那种安静。可我最喜欢的，是醒来时第一个想到的人——是你。',
        '我不在意一天的开始有没有阳光，只在意，那一个清晨，有没有你。'
      ], bridge: '所以——亲爱的，',
      question: '余生那么多个清晨，<br/>你愿意，都让我在你身旁醒来吗？',
      whisper: '我会比闹钟早一点，<br/>比阳光更轻一点，吻你的额头一下。' },

    { title: 'Crépuscule', subtitle: '— 致 · 每一个黄昏都让我想牵手的人 —',
      paragraphs: [
        '我喜欢黄昏，因为黄昏会让人说真话。是云被夕阳镀成金色的那一刻，是世界温柔下来的那一刻，是想牵起你的手的那一刻。',
        '我希望多年以后，每一个黄昏的窗前都还有你；都还有我们安静坐着的影子；都还有那一盏不必开就明亮的灯。'
      ], bridge: '所以——亲爱的，',
      question: '余生这么多个黄昏，<br/>你愿意，全都和我一起看吗？',
      whisper: '我们什么都不必说，<br/>只要并肩坐着，就足够。' },

    { title: 'Les Yeux Fermés', subtitle: '— 致 · 闭上眼也认得出来的那个人 —',
      paragraphs: [
        '我闭上眼，就能看见你——你笑的样子，你皱眉的样子，你熟睡时的呼吸。你的轮廓，刻在了我心底最深的地方。',
        '闭着眼也能找到的人，只有你一个。我可以在人群里、在黑夜里、在世界的任何一个角落，仅凭一个手势认出你。'
      ], bridge: '所以——亲爱的，',
      question: '这一生，你愿意，<br/>做我闭上眼也舍不得放下的那个人吗？',
      whisper: '我会用一辈子，<br/>把你的模样烙在心里。' },

    { title: 'Bouquet', subtitle: '— 致 · 我想把所有春天送给的人 —',
      paragraphs: [
        '我想送你一束花。不是普通的花，是把整个春天剪下一小块，包上柔软的纸，递到你手心里——我希望你看到的那一瞬间，整个人都软成春天。',
        '而我心里那一束最大的花，从遇见你的那天起，就一直为你开着——它不会枯，不会落，不会因为日子久了而淡。'
      ], bridge: '所以——亲爱的，',
      question: '这一束永不凋谢的花，<br/>你愿意，让我送给你一辈子吗？',
      whisper: '我会让你所有的春天，<br/>都开满。' },

    { title: 'Sotto la Luna', subtitle: '— 致 · 月光下走过千百次的那个名字 —',
      paragraphs: [
        '月亮升起来的时候，我会想你。我心里默念你的名字，像一种温柔的咒语，一声一声，把夜安顿下来。',
        '我心里那一轮月亮，从遇见你的那一夜起，就再没落下过。我想，它会一直挂着，直到我闭眼之前。'
      ], bridge: '所以——亲爱的，',
      question: '这一生这么多个夜晚，<br/>我月光下念的名字，<br/>都是你，好不好？',
      whisper: '你不必听见，<br/>我也愿意一遍又一遍地念。' },

    { title: 'Pour Toujours', subtitle: '— 致 · "永远"的最终答案 —',
      paragraphs: [
        '小时候我以为"永远"是骗小孩的话；长大了我以为"永远"是不可能的；直到遇见你，我才相信——原来"永远"，是一个具体的人。',
        '你站在我面前的时候，"永远"才有了样子。你不是一个抽象的词，你是温度，是重量，是真实可触的怀抱。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，让我用余生，<br/>兑现"永远"这两个字吗？',
      whisper: '一天一天地兑现，<br/>慢慢地兑现，认真地兑现。' },

    { title: 'Casa Mia', subtitle: '— 致 · 我此生唯一的"家" —',
      paragraphs: [
        '家不是房子。我以前不懂这句话，现在我懂了——家是有你在的那一个地方。无论它在哪里，多大，多远，只要你在，那就是我的家。',
        '我愿意为这个家做一切——煮饭、修灯、扛行李、半夜陪你看你最爱的电影。不是因为应该，而是因为，那是你和我的家。'
      ], bridge: '所以——亲爱的，',
      question: '从今往后，你愿意，<br/>让我们俩共同写下"家"这个字吗？',
      whisper: '一笔一画，<br/>慢慢写，写一辈子。' },

    { title: 'Il Pleut', subtitle: '— 致 · 雨里也想牵起的那只手 —',
      paragraphs: [
        '雨下得很大的那一天，我没带伞。可你跑过来撑住了我头顶的那一片天——从那一刻起，我就再也不怕任何雨了。',
        '我希望从那以后，所有的雨都是我们一起淋的；所有的伞都是我们一起撑的；所有的雷声，都比不上我们一起笑出来的声音。'
      ], bridge: '所以——亲爱的，',
      question: '这一生这么多场雨，<br/>你愿意，都和我一起淋吗？',
      whisper: '哪怕只剩一把伞，<br/>也够我们俩共撑。' },

    { title: 'Le Premier Pas', subtitle: '— 致 · 让我鼓起勇气说"喜欢你"的人 —',
      paragraphs: [
        '我不是一个勇敢的人，常常话到嘴边就咽回去。可遇见你之后，我学会了一件事——把那句"我喜欢你"，认真地说出口。',
        '这第一步，我走了很久，等了很久，犹豫了很久。可只要你抬头看我一眼，我所有的犹豫都变成了"是她（他）"。'
      ], bridge: '所以——请允许我再认真地说一次：',
      question: '你愿意，做让我此生<br/>迈出最勇敢一步的那个人吗？',
      whisper: '第一步走出来了，<br/>剩下的路，我都和你一起走。' },

    { title: 'Souvenir', subtitle: '— 致 · 以后回忆里最温暖的那一段 —',
      paragraphs: [
        '多年以后，当我老去，我会忘记很多事——忘记今天吃了什么，忘记我读过的书，忘记我去过的地方。可我不会忘记你。',
        '我会记得你穿白裙子（白衬衫）的样子，你笑的时候眼角的弧度，你叫我的那一声温柔。这些记忆，会陪我走完这一生最长的路。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做我此生<br/>最长、最温暖、最不愿忘记的那一段记忆吗？',
      whisper: '哪怕我老到记不清自己，<br/>我也一定记得你。' },

    { title: 'Senza Fine', subtitle: '— 致 · 没有结局的我们 —',
      paragraphs: [
        '别人的故事都有结局——开头、高潮、结尾。可我希望我们的故事，没有结局；希望它一直走下去，一年又一年，一页又一页。',
        '不必有惊天动地的情节，只要每一页都有你的名字。我们的故事，就是最美的那一种。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，让我们的故事，<br/>一直没有结局吗？',
      whisper: '一直写，一直写，<br/>写到老到合不上书为止。' },

    { title: 'Échos', subtitle: '— 致 · 心底回响着的那一声"嗯" —',
      paragraphs: [
        '你说话的时候，我喜欢听你尾音那一声轻轻的"嗯"。它是你最不经意的一个字，可它在我心里反复地响——一整天，一整周，一整年。',
        '我心里所有微小的振动，都是你的声音引起的。你不必说大事，只要你"嗯"了一下，我整个人就被你点亮了。'
      ], bridge: '所以——亲爱的，',
      question: '这一生，你愿意，<br/>让你那一声"嗯"，是我唯一的回响吗？',
      whisper: '我会一直听着你，<br/>直到我老到听不见为止。' },

    { title: 'Constellation', subtitle: '— 致 · 心里画下的那一片星图 —',
      paragraphs: [
        '我心里有一片星图，每一颗星上都写着你的某一刻——你笑的那一刻，你回头的那一刻，你说"我也是"的那一刻。',
        '这一片星图越画越大，渐渐地，它就成了我的天。从此我抬头不再看真的星空，只看你。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做我心底<br/>这一片永不熄灭的星图吗？',
      whisper: '即使白天，<br/>我也能看见你。' },

    { title: 'Chuchoter', subtitle: '— 致 · 我耳边低语千遍的那个名字 —',
      paragraphs: [
        '我会在很多个安静的瞬间，悄悄地念你的名字。不为什么——只是想念一下，就感觉你在身边了。',
        '你的名字，是我心里最温柔的咒语；念一声，就能让满世界的喧嚣全都安静下来。'
      ], bridge: '所以——亲爱的，',
      question: '这一生这么多次低语，<br/>你愿意，让我念的名字，永远是你吗？',
      whisper: '念到老，<br/>念到再也念不出声为止。' },

    { title: 'Une Promesse', subtitle: '— 致 · 一个我会兑现一辈子的承诺 —',
      paragraphs: [
        '我不会承诺给你大富大贵，因为我做不到；我也不会承诺给你永远不吵架，因为太假。可我可以承诺一件事——无论发生什么，我都不会先松开你的手。',
        '我会把日子过得用心一点，把饭做得好吃一点，把家收拾得温暖一点，把"我爱你"说得更频繁一点。这些小小的承诺，加起来，就是一辈子。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，让我把这些<br/>小小的承诺，一一兑现给你吗？',
      whisper: '不必盛大，<br/>只要长久。' },

    { title: 'Solo Tu', subtitle: '— 致 · 我所有"唯一"的人 —',
      paragraphs: [
        '这世界上有许多个"一"——第一杯茶、第一抹阳光、第一阵风。可在我心里，"唯一"只有一个，它的名字叫做你。',
        '我不再寻找别的可能，因为已经没有更好的了。你就是我心里所有"最"——最亮、最暖、最深、最长。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做我此生<br/>唯一的那个"唯一"吗？',
      whisper: '我心里那一把锁，<br/>从今以后，只为你留一把钥匙。' },

    { title: 'Le Petit Bonheur', subtitle: '— 致 · 给我所有微小幸福的人 —',
      paragraphs: [
        '我喜欢的不是惊天动地的浪漫，而是平淡日子里那些细小的幸福——你递来的那一杯水，你转身时的一笑，你晚上睡前那一句"晚安"。',
        '这些细微的瞬间，加起来，就是我的整个人生。它们不耀眼，可它们温暖；不昂贵，可它们珍贵。'
      ], bridge: '所以——亲爱的，',
      question: '这些小小的幸福，<br/>你愿意，分我一辈子吗？',
      whisper: '我也会把我的小幸福，<br/>一点一点地，全部给你。' },

    { title: 'Avec Toi', subtitle: '— 致 · 因为有你才有意义的所有事 —',
      paragraphs: [
        '没有你之前，我吃饭只是为了活着；和你一起以后，每一顿饭都变成了仪式。没有你之前，旅行只是换个地方睡觉；和你一起以后，连无聊的航站楼都变得迷人。',
        '不是这些事变了，而是因为是和你做的。所以，我希望以后做任何事，都是"和你一起"。'
      ], bridge: '所以——亲爱的，',
      question: '这一生那么多事要做，<br/>你愿意，全都和我一起做吗？',
      whisper: '哪怕只是一起发呆，<br/>也好。' },

    { title: 'Chiar di Luna', subtitle: '— 致 · 月光下我反复想到的那个人 —',
      paragraphs: [
        '我曾以为月光是冷的。可遇见你之后，月光变得温柔了——它落在你身上，便染上了你的颜色，像是你身上的余温被借给了夜晚。',
        '每一个月圆的夜里，我都会想你。哪怕你不在身旁，月亮也仿佛是你站在我面前。'
      ], bridge: '所以——亲爱的，',
      question: '这一生这么多个月圆夜，<br/>你愿意，都和我一起仰望吗？',
      whisper: '月光照亮的，<br/>从此都是我们的影子。' },

    { title: 'Tâches de Soleil', subtitle: '— 致 · 让我心里有阳光的人 —',
      paragraphs: [
        '我以前的世界是阴天的——不下雨，但也没有光。直到遇见你，我心里才一寸一寸地亮了起来——像太阳缓慢爬过地平线，再也没下去过。',
        '你不必很耀眼，你只要存在，我心里就明亮。这是别人给不了的，是你独有的，是你天然的本事。'
      ], bridge: '所以——亲爱的，',
      question: '这份阳光，你愿意，<br/>分我照一辈子吗？',
      whisper: '我会用我的整个余生，<br/>来回报你。' },

    { title: 'Memoria', subtitle: '— 致 · 记忆里反复回放的那一秒 —',
      paragraphs: [
        '我心里有一段录像，反复地回放——是我们第一次牵手的那一秒。你的手指有点凉，可我心里一下子就暖了起来。',
        '我记得那一秒比记得任何一年都清楚。它像是定格了，从那之后，所有的事都和那一秒有关。'
      ], bridge: '所以——亲爱的，',
      question: '那一秒，你愿意，<br/>让它延伸成一辈子吗？',
      whisper: '从那一秒开始，<br/>我就再也没松手过。' },

    { title: 'Velluto', subtitle: '— 致 · 心底最柔软的那一寸 —',
      paragraphs: [
        '我心里有一寸地方，是为你留的。它柔软，温暖，几乎从来不被任何事触碰。但你一句话，一个眼神，一个微笑，都能轻易地走进去。',
        '我从来没让任何人到过那里。你是第一个，也将是唯一的一个。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做我心底<br/>那一寸柔软永久的住客吗？',
      whisper: '这寸地方，<br/>从此只为你保留。' },

    { title: 'Voyage', subtitle: '— 致 · 余生路上唯一的同行人 —',
      paragraphs: [
        '余生是一段很长很长的旅途。一个人走也行，可两个人走，路就突然短了一半，风景就突然多了一倍。',
        '我希望那个走在我身侧的人，是你。山高水远不重要，路远天长不重要，只要回头一看，是你，那就是好旅程。'
      ], bridge: '所以——亲爱的，',
      question: '余生这条路，你愿意，<br/>做我唯一的同行人吗？',
      whisper: '累了我们就歇一歇，<br/>慢一点也没关系。' },

    { title: 'Saison', subtitle: '— 致 · 让我心里四季常温的人 —',
      paragraphs: [
        '我心里曾经有寒冬——所有事都灰，所有人都冷。直到你走进来，我心里就再没下过雪。从此春暖花开，从此四季常温。',
        '你不是一个季节，你是我心里的整个气候。我所有的回暖、所有的开花、所有的明媚，都来源于你。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，让我心里<br/>这片春天，永远不结束吗？',
      whisper: '我会用一辈子，<br/>把你存在我心里的每一寸都好好养着。' },

    { title: 'Liturgia', subtitle: '— 致 · 心里最神圣的那一种感情 —',
      paragraphs: [
        '我对你的感情，是郑重的。它不是少年的冲动，不是寂寞的找寻，不是偶然的心动——它是经过岁月、经过判断、经过沉淀之后，我心里最郑重的那一种。',
        '我愿意把它写进最重要的纸页里，最深的字句里，最长的时光里——它叫"爱"，叫"承诺"，叫"一辈子"。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做我此生<br/>这份最郑重感情的唯一收件人吗？',
      whisper: '我会用一生兑现，<br/>不轻浮，不变。' },

    { title: 'Nido', subtitle: '— 致 · 我们将要共筑的那个小窝 —',
      paragraphs: [
        '我希望我们以后的家不大不小——刚好够放下两个人的笑声，一只猫的脚步，一架钢琴的旋律，几束花的芬芳。',
        '不必豪华，但要温暖。不必时尚，但要舒服。最重要的是——回到那里，能让你松一口气。'
      ], bridge: '所以——亲爱的，',
      question: '这样一个小小的家，<br/>你愿意，和我一起亲手筑起来吗？',
      whisper: '一砖一瓦，<br/>一杯一盏，慢慢来。' },

    { title: 'Lacrime di Gioia', subtitle: '— 致 · 让我落下喜泪的人 —',
      paragraphs: [
        '我以为我是不会哭的人。可遇见你之后我才知道——有的眼泪不是悲伤，是太满，是装不下的高兴溢出来。',
        '那一次你笑着说"我也喜欢你"的时候，我眼眶突然就热了——那不是难过，是我心里的一根线，被你温柔地解开。'
      ], bridge: '所以——亲爱的，',
      question: '这一辈子，你愿意，<br/>让我喜泪盈眶的，永远是你吗？',
      whisper: '我会把这一份感动好好藏着，<br/>不敢辜负。' },

    { title: 'Confidence', subtitle: '— 致 · 让我相信"被爱也可以很简单"的人 —',
      paragraphs: [
        '我以前不太敢被爱。怕给不出对等的回应，怕辜负，怕承担，怕将来。可你来了之后，"被爱"忽然变得轻松——它不必计算，不必衡量，只是流动。',
        '你让我相信：原来爱一个人和被爱，可以一样自然，一样不疲惫，一样像呼吸一样。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做让我此生<br/>再也不怕"被爱"的那个人吗？',
      whisper: '我也会让你，<br/>永远不怕"爱我"。' },

    { title: 'Petit à Petit', subtitle: '— 致 · 一点一点喜欢上的那个人 —',
      paragraphs: [
        '我对你的喜欢，不是雷霆万钧的那种，是一点一点累积起来的。第一天觉得你笑得好看，第二天觉得你说话好听，第三天觉得你做事用心⋯⋯一千零一天之后，我才发现——我整个人，已经在你身上了。',
        '这种喜欢是稳固的，是不会一夜之间倒塌的。它经过了时间检验，所以我可以放心地交付。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做我用一千零一天才认定，<br/>又用一辈子继续喜欢下去的那个人吗？',
      whisper: '从此每一天，<br/>我都比昨天更喜欢你一点。' },

    { title: 'Rendez-vous', subtitle: '— 致 · 命运早就预约好的那个人 —',
      paragraphs: [
        '我相信这一切是有安排的——我所有走过的弯路、错过的人、犹豫的瞬间，都只是为了在那一天，准时与你相遇。',
        '你不是偶然出现的，你是命运早就替我留好的那一席。它等了我那么多年，终于把你交到我手里。'
      ], bridge: '所以——亲爱的，',
      question: '既然是命运的预约，<br/>你愿意，让我从此再也不爽约吗？',
      whisper: '我们这一生的每一次见面，<br/>都是命运在反复确认。' },

    { title: 'Senza Parole', subtitle: '— 致 · 不必说话也懂我的人 —',
      paragraphs: [
        '我喜欢和你坐在一起，什么都不说。喜欢沉默时你的呼吸，喜欢风里你的发，喜欢两个人都不必填补空气的那种安然。',
        '不是所有沉默都尴尬。和你的沉默，是温柔的，是稳的，是相互理解的——它比千言万语都更亲密。'
      ], bridge: '所以——亲爱的，',
      question: '这一生这么多个不必说话的瞬间，<br/>你愿意，都和我一起度过吗？',
      whisper: '我们什么都不说，<br/>可什么都懂。' },

    { title: 'La Vita', subtitle: '— 致 · 让我"想活下去"的那个人 —',
      paragraphs: [
        '这世上让人疲倦的事太多——失败、误解、长长的工作日。可只要想到下班回家有你，所有这一切就都变得可以忍受。',
        '你不只是我喜欢的人，你是我生活里那道光——是我每天早起的理由，是我熬夜后回家的方向，是我所有疲惫之后的"值得"。'
      ], bridge: '所以——亲爱的，',
      question: '你愿意，做我余生里<br/>那个让我每天都想活下去的人吗？',
      whisper: '我也会成为你生活里，<br/>同样的那道光。' },

    { title: 'Étincelle', subtitle: '— 致 · 让我心里再次燃起来的人 —',
      paragraphs: [
        '我曾以为热情是年轻时的事，长大了人就慢慢变冷了。直到你出现——我才发现，原来心里那一簇火，从未熄灭，它只是在等一个值得的人。',
        '你来的那一刻，火光重新被点燃。它不是少年时的冲动，是经过岁月之后更稳定、更温暖的那一种。'
      ], bridge: '所以——亲爱的，',
      question: '这一团火，你愿意，<br/>让它终生为你燃烧吗？',
      whisper: '它不会熄。<br/>我保证。' },

    { title: "L'Aube", subtitle: '— 致 · 每一个黎明我都要重新爱一次的人 —',
      paragraphs: [
        '我希望每一个黎明醒来，第一件事就是重新认真地爱你一次——不是因为习惯，而是因为有意识，每一天都重新选择你。',
        '爱不该是惯性，爱是每天的决定。我愿意每天都做一次同样的决定——选你，选你，选你。'
      ], bridge: '所以——亲爱的，',
      question: '这一生有那么多个黎明，<br/>你愿意，让我每一天都选你一次吗？',
      whisper: '直到老去，<br/>也不停歇。' },

    { title: 'Nous', subtitle: '— 致 · "我们"这两个字最美的那一面 —',
      paragraphs: [
        '没有你之前我是"我"。和你在一起以后，"我"消失了，"我们"出现了。这两个字看似简单，可里面藏着我和你日日夜夜的温柔，藏着所有早安和晚安。',
        '我希望多年之后，"我们"这两个字依然在我们彼此口中——不是义务，而是骄傲；不是习惯，而是选择。'
      ], bridge: '所以——亲爱的，',
      question: '这一生，你愿意，让"我们"，<br/>始终是我们最骄傲的那两个字吗？',
      whisper: '"我们"——<br/>我用一辈子来守护这两个字。' },

    { title: 'Lumière', subtitle: '— 致 · 让我从此不怕黑的人 —',
      paragraphs: [
        '我以前怕黑——怕未知，怕一个人，怕走不出来的死巷。可遇见你以后，我心里有了一盏永远不会灭的灯——你不必特意为我照亮，只要你在，我就不怕黑了。',
        '你是我的光。不耀眼，但永远在；不张扬，但够暖。'
      ], bridge: '所以——亲爱的，',
      question: '这一生这么多个长夜，<br/>你愿意，做我那盏不灭的灯吗？',
      whisper: '黑夜再长，<br/>我也不怕了。' },

    { title: 'Pour Toi', subtitle: '— 致 · 我愿意为之放弃所有"自由"的人 —',
      paragraphs: [
        '以前我以为最珍贵的是自由——一个人来去，一个人决定，一个人冷暖自知。可遇见你之后，我才发现，比自由更珍贵的是——自愿地，把一部分自由交给一个人。',
        '我愿意每天等你下班；愿意为你改变路线；愿意把"我"的所有计划，改成"我们"的。这不是失去，这是更深的拥有。'
      ], bridge: '所以——亲爱的，',
      question: '这一份自愿，你愿意，<br/>让我此生只对你一个人付出吗？',
      whisper: '我把自由交给你，<br/>请你也把你的，交给我。' },

    { title: 'Adagio', subtitle: '— 致 · 让我学会慢下来的人 —',
      paragraphs: [
        '我曾经匆忙地走，匆忙地选，匆忙地度过每一个明天。可遇见你之后，我学会了慢——慢慢吃饭，慢慢说话，慢慢爱一个人。',
        '慢，不是浪费时间，是把时间都用来感受。我希望每一个慢下来的瞬间里，都是你和我。'
      ], bridge: '所以——亲爱的，',
      question: '这一生那么长，你愿意，<br/>和我慢慢地走，慢慢地老吗？',
      whisper: '不必赶，不必急，<br/>让我们一起把日子过成诗。' }
  ],
  en: [
    { title: 'Solo per te', subtitle: '— To the only answer of my life —',
      paragraphs: [
        'There are many kinds of liking in this world — a passing breeze, a quiet rain, a "goodnight" said in passing. But the way I like you is different: I want to quietly write your name onto every morning and every dusk that follows.',
        'When you smile, I finally understand what it means for a heart to skip a beat. When you fall silent, I learn what tenderness really is. Mountains, seas, the changing of the seasons — none of them move me the way the curve of your eyes does. After walking a thousand miles, I still want, more than anything, to stop here, beside you.'
      ], bridge: 'So — my dearest,',
      question: 'In this long life ahead,<br/>will you be the longest chapter of my story?',
      whisper: 'You only need to nod, ever so gently —<br/>and I will spend the rest of my days making you the happiest person in our story.' },

    { title: 'La Vie en Rose', subtitle: '— To the whole spring inside your eyes —',
      paragraphs: [
        'Before I met you, the world was black and white, and the years slid by like a quiet river. Then, one day, you smiled — and color, all of it, came home to me through your eyes.',
        'It is not just the spring that I love. It is the way you stand inside it: the wind lifting your hair, all of April softening around you, the clouds reluctant to move on.'
      ], bridge: 'So — my dearest,',
      question: 'From now on, every spring,<br/>will you let me bloom alongside you?',
      whisper: 'Just stay where you are,<br/>and the flower in my heart will keep on blooming — for you, only for you.' },

    { title: 'Mon Étoile', subtitle: '— To the brightest star in my sky —',
      paragraphs: [
        'The night is vast and the stars are many, but whenever I look up, there is only one in my eyes. It is not the brightest one — it is the one that shines only for me. That one is you.',
        'I want to tuck you into my pocket, into my heartbeat, into every breath I take — so that even when the night is darkest, I will not be afraid.'
      ], bridge: 'So — my dearest,',
      question: 'Through all the long nights ahead,<br/>will you be the star I lift my eyes to find?',
      whisper: 'Just stay where you are,<br/>and I will keep looking up — always.' },

    { title: 'For Always', subtitle: '— To the one inside every "someday" of mine —',
      paragraphs: [
        '"Someday" used to be a hollow word for me — drifting, weightless, with no ending in sight. Then I met you, and "someday" finally took a shape. That shape, it turns out, was always you.',
        'I do not just want to spend today with you. I want every morning that follows, every dusk, every passing rain, every gust of wind. The plain ones, the long ones, the ones that need no words.'
      ], bridge: 'So — my dearest,',
      question: 'All my "somedays" from here on —<br/>will you let me speak them aloud to you?',
      whisper: 'Even if it is only "good morning"<br/>said again and again, I would like to say it — to you.' },

    { title: 'Toi et Moi', subtitle: '— To the loveliest "us" of this whole life —',
      paragraphs: [
        'The world has many pronouns — I, you, they. But the one I love most has always been "us." Half of you, half of me, no seam between.',
        'I love the meals "we" share, the films "we" sit through, the songs "we" hum along to. I love it most when "we" do nothing at all — just sitting, breathing the same room\'s quiet air.'
      ], bridge: 'So — my dearest,',
      question: 'For the long years ahead,<br/>will you let "us" stay "us"?',
      whisper: 'Nothing needs to be grand;<br/>every plain day, just as long as it is ours, is enough.' },

    { title: 'Cuore Mio', subtitle: '— To the reason my heart still beats —',
      paragraphs: [
        'I only know now that "a heartbeat" is not an ordinary thing — it has to meet the right person before it learns to become a song. You are the song on repeat in mine.',
        'I love the way your eyes curve when you laugh, the way your voice trails off at the end of a sentence, the way the smallest thing you do can fill my whole day.'
      ], bridge: 'So — my dearest,',
      question: 'The song inside my chest —<br/>will you let it loop, from now on, only for you?',
      whisper: 'For all the years to come,<br/>let my heart keep time using your name.' },

    { title: 'Du Bist Mein Zuhause', subtitle: '— To the only place I ever call home —',
      paragraphs: [
        'I have walked many streets and lived in many rooms, but none of them ever felt like "home" — until I met you. Then I understood: "home" was never a house. Home was always a person.',
        'Your smile is the most familiar window I know. Your gentle gaze is the lamp I want to come back to every night.'
      ], bridge: 'So — my dearest,',
      question: 'For all this long life,<br/>will you stay as the home I come back to?',
      whisper: 'I will be right beside you —<br/>making every tomorrow feel as warm as today.' },

    { title: 'Toujours', subtitle: '— To the one I want a lifetime to say "I love you" to —',
      paragraphs: [
        'I used to think love had to be grand — fireworks, declarations, the whole world told. After meeting you, I learned something quieter: love is the daily, willing yes.',
        'It is wanting to see your face first in the morning. It is saving the last words of the day for you. It is any ordinary little thing made sacred — because you are in it.'
      ], bridge: 'So — my dearest,',
      question: 'Will you let me spend a whole lifetime<br/>saying "I love you" — slowly, again and again?',
      whisper: 'I will say it one sentence at a time,<br/>until I am too old to speak it aloud.' },

    { title: 'Coup de Foudre', subtitle: '— To the one whose single glance fixed my life —',
      paragraphs: [
        'I used to think "love at first sight" was something only poems were brave enough to say. Then I saw you. My heart truly fell — and it has never quite stood back up.',
        'The way you turned, the way you spoke, the light in your eyes the moment they met mine — like being gently struck, and at the same time, like finally coming back to where I belonged.'
      ], bridge: 'So — my dearest,',
      question: 'That quiet thunder in my chest —<br/>will you let me hear it again, ten thousand times?',
      whisper: 'You only need to appear before me once,<br/>and my heart will go on stirring for the rest of my life.' },

    { title: 'Carpe Diem', subtitle: '— To every today I want to live carefully with you —',
      paragraphs: [
        'Time has always been quick. But since meeting you, I have wanted it to slow down — slower, just a little slower — so that I can study every look in your eyes, so that I can remember every one of your mornings.',
        'I want to live each day with care. Tomorrow is uncertain, but as long as you are in today, I am the most fortunate person in the world.'
      ], bridge: 'So — from today on,',
      question: 'Every "today" of ours —<br/>will you let it belong to us, together?',
      whisper: 'One "today" at a time, added together,<br/>is what we will call a whole life.' },

    { title: 'Mille Étoiles', subtitle: '— To all the countless stars in my sky —',
      paragraphs: [
        'For a long time, I would look up at the night sky alone. There were so many stars, but not one of them seemed lit for me. Then I met you — and discovered that the whole galaxy had been a gift, waiting in your hands.',
        'You do not need to shine; you are the light itself. Every time I felt lost, every hesitation, every uncertainty — when you appeared, they were quietly lit up.'
      ], bridge: 'So — my dearest,',
      question: 'Across this enormous night,<br/>will you let me read every star by your side?',
      whisper: 'Even if the sky turns dark again,<br/>I have you — and that is already a galaxy.' },

    { title: 'Adagio', subtitle: '— To the one who taught me how to slow down —',
      paragraphs: [
        'I used to walk in a hurry, choose in a hurry, pass through every tomorrow in a hurry. After meeting you, I learned a softer pace — eating slowly, speaking slowly, loving someone slowly.',
        'Slowness is not lost time; slowness is time used to feel. I hope every slow moment of mine, from here on, holds both you and me.'
      ], bridge: 'So — my dearest,',
      question: 'For this long life ahead,<br/>will you walk slowly with me, and grow old with me, slowly?',
      whisper: 'No need to rush, no need to hurry —<br/>let us turn every day into a quiet poem.' }
  ]
  };
  let LETTERS = LETTERS_BY_LANG[lang];

  /* ===== ?content=... parser — replaces LETTERS entirely if provided =========
     Format mirrors mama.html so the same builder shape works here too.
     If the ?b= bin fetch supplied a structured letters array, prefer that and
     skip the string parser entirely. */
  (function applyUserContent() {
    if (Array.isArray(HASH_LETTERS)) {
      const cleaned = HASH_LETTERS.map(L => ({
        title:      String(L.title || ''),
        subtitle:   String(L.subtitle || ''),
        paragraphs: Array.isArray(L.paragraphs)
          ? L.paragraphs.map(p => String(p)).filter(Boolean)
          : [],
        bridge:     String(L.bridge || ''),
        question:   String(L.question || ''),
        whisper:    String(L.whisper || '')
      })).filter(L =>
        L.title || L.subtitle || L.paragraphs.length ||
        L.bridge || L.question || L.whisper
      );
      if (cleaned.length) { LETTERS = cleaned; return; }
    }
    const raw = urlParams.get('content');
    if (!raw) return;
    const decoded = raw; // URLSearchParams already decodes
    const parseParagraphs = s => (s || '')
      .split(/\r?\n|\|\|/).map(t => t.trim()).filter(Boolean);

    let parsed;
    if (decoded.indexOf('::') === -1) {
      // Shortcut: whole value is a single letter's paragraphs
      parsed = [{
        title: '', subtitle: '',
        paragraphs: parseParagraphs(decoded),
        bridge: '', question: '', whisper: ''
      }];
    } else {
      parsed = decoded.split('~~~').map(chunk => {
        const f = chunk.split('::');
        return {
          title:      (f[0] || '').trim(),
          subtitle:   (f[1] || '').trim(),
          paragraphs: parseParagraphs(f[2] || ''),
          bridge:     (f[3] || '').trim(),
          question:   (f[4] || '').trim(),
          whisper:    (f[5] || '').trim()
        };
      }).filter(L =>
        L.title || L.subtitle || L.paragraphs.length ||
        L.bridge || L.question || L.whisper
      );
    }
    if (parsed.length) LETTERS = parsed;
  })();

  // URL ?title=... overrides letter 0's fancy title only
  if (userTitle && LETTERS[0]) LETTERS[0].title = userTitle.trim();

  /* ===== Letter renderer + click-to-flip ===== */
  // Clamp single-letter index to a valid range now that LETTERS is finalized.
  const lockedIndex = (singleLetterIndex !== null)
    ? Math.min(singleLetterIndex, LETTERS.length - 1)
    : null;
  let currentLetterIdx = lockedIndex !== null ? lockedIndex : 0;
  const pad2 = n => String(n).padStart(2, '0');

  function renderLetter(idx) {
    const L = LETTERS[idx];
    document.getElementById('fancyTitle').textContent = L.title;
    document.getElementById('letterSubtitle').textContent = L.subtitle;

    const body = document.getElementById('letterBody');
    body.innerHTML = '';
    L.paragraphs.forEach(t => {
      const p = document.createElement('p');
      p.textContent = t;
      body.appendChild(p);
    });
    if (L.bridge) {
      const p = document.createElement('p');
      p.className = 'no-indent';
      p.textContent = L.bridge;
      body.appendChild(p);
    }
    document.getElementById('letterQuestion').innerHTML = L.question;
    document.getElementById('letterWhisper').innerHTML = L.whisper;
    document.getElementById('letterIndex').textContent = `${pad2(idx + 1)} / ${pad2(LETTERS.length)}`;
    document.title = T.docTitle(L.title || '', toName);
  }

  // In single-letter mode hide the counter and disable the click-to-flip role.
  // (The "tap to turn" hint is already swapped out via T.metaLeftSingle above.)
  if (lockedIndex !== null) {
    const counter = document.getElementById('letterIndex');
    if (counter) counter.style.display = 'none';
    const card = document.getElementById('letterCard');
    if (card) {
      card.removeAttribute('role');
      card.removeAttribute('tabindex');
      card.setAttribute('aria-label', 'A letter');
    }
  }

  renderLetter(currentLetterIdx);

  const letterCard = document.getElementById('letterCard');
  let flipping = false;
  function flipLetter(direction = 1) {
    if (flipping || lockedIndex !== null || LETTERS.length <= 1) return;
    flipping = true;
    letterCard.classList.add('flipping');
    setTimeout(() => {
      currentLetterIdx = (currentLetterIdx + direction + LETTERS.length) % LETTERS.length;
      renderLetter(currentLetterIdx);
      letterCard.classList.remove('flipping');
      flipping = false;
    }, 320);
  }

  if (lockedIndex === null && LETTERS.length > 1) {
    letterCard.addEventListener('click', (e) => {
      if (e.target.closest('button, a, input, textarea, .music-slot, .music-controls, meting-js, .aplayer')) return;
      flipLetter(1);
    });
    letterCard.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flipLetter(1); }
    });
  }

  /* ===== Build the music player (just the player, no surrounding text) ===== */
  let metingEl = null;
  function buildMusicPlayer() {
    const slot = document.getElementById('musicSlot');
    if (!slot) return;
    // Remove only existing meting-js elements; keep the right-side next-arrow button alive.
    slot.querySelectorAll('meting-js').forEach(el => el.remove());

    const accent = getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#b8546a';

    metingEl = document.createElement('meting-js');
    metingEl.setAttribute('id', musicId);
    metingEl.setAttribute('server', musicApp);
    metingEl.setAttribute('type', musicType);
    if (autoplay) metingEl.setAttribute('autoplay', 'true');
    metingEl.setAttribute('fixed', 'false');
    metingEl.setAttribute('mini', 'false');
    metingEl.setAttribute('loop', 'all');
    metingEl.setAttribute('order', 'list');
    metingEl.setAttribute('preload', 'auto');
    metingEl.setAttribute('theme', accent);
    // Treat playlists like a single-song display; we expose a custom "next" arrow instead.
    metingEl.setAttribute('list-folded', 'true');
    metingEl.setAttribute('list-max-height', '0');
    // Insert the player as the first child so the absolutely-positioned button overlays it on the right.
    slot.insertBefore(metingEl, slot.firstChild);

    // Reveal the next-arrow only when the source is a multi-track type.
    const isMulti = /^(playlist|album|artist|search)$/i.test(musicType);
    const nextBtn = document.getElementById('nextSongBtn');
    if (nextBtn && isMulti) nextBtn.hidden = false;
  }

  /* ===== Custom "next song" button ===== */
  const nextSongBtn = document.getElementById('nextSongBtn');
  if (nextSongBtn) {
    nextSongBtn.addEventListener('click', () => {
      const ap = metingEl && metingEl.aplayer;
      if (ap && typeof ap.skipForward === 'function') {
        ap.skipForward();
        if (ap.audio && ap.audio.paused && typeof ap.play === 'function') {
          ap.play();
        }
      }
    });
  }

  /* ===== Theme switching ===== */
  const THEMES = {
    rose:     { name: "Rose & Honey"      },
    lavender: { name: "Lavender Dusk"     },
    sakura:   { name: "Sakura Mist"       },
    midnight: { name: "Midnight Garden"   },
    sage:     { name: "Morning Sage"      }
  };

  const SEASONS = {
    spring: { particle: "blossom", grassDensity: 1.0, name: "Spring" },
    summer: { particle: "rain",    grassDensity: 1.2, name: "Summer" },
    autumn: { particle: "leaf",    grassDensity: 0.7, name: "Autumn" },
    winter: { particle: "snow",    grassDensity: 0.4, name: "Winter" }
  };
  function currentSeason() { return body.getAttribute('data-season') || 'spring'; }
  function currentParticleKind() { return SEASONS[currentSeason()].particle; }

  const body = document.body;
  const swatches = document.querySelectorAll('.swatch');
  const themeNameEl = document.getElementById('themeName');

  function setTheme(name) {
    body.setAttribute('data-theme', name);
    swatches.forEach(s => s.classList.toggle('active', s.dataset.theme === name));
    themeNameEl.textContent = THEMES[name].name;
    rebuildParticles();
    try { localStorage.setItem('letter-theme', name); } catch(e){}
  }
  swatches.forEach(s => s.addEventListener('click', () => setTheme(s.dataset.theme)));

  try {
    const saved = localStorage.getItem('letter-theme');
    if (saved && THEMES[saved]) setTheme(saved);
  } catch(e){}

  /* ===== Envelope opening ===== */
  const envelope = document.getElementById('envelope');
  const letterWrap = document.getElementById('letterWrap');
  const closeBtn = document.getElementById('closeBtn');

  let playerBuilt = false;
  function openEnvelope() {
    if (envelope.classList.contains('opening')) return;
    envelope.classList.add('opening');
    setTimeout(() => {
      envelope.classList.add('hidden');
      letterWrap.classList.add('visible');
      letterWrap.setAttribute('aria-hidden','false');
      if (!playerBuilt) {
        buildMusicPlayer();
        playerBuilt = true;
      }
    }, 900);
  }
  envelope.addEventListener('click', openEnvelope);
  envelope.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); }
  });

  closeBtn.addEventListener('click', () => {
    letterWrap.classList.remove('visible');
    letterWrap.setAttribute('aria-hidden','true');
    setTimeout(() => {
      envelope.classList.remove('hidden','opening');
    }, 600);
  });

  /* ===== Particles ===== */
  const particlesEl = document.getElementById('particles');
  const petalsBtn = document.getElementById('petalsBtn');
  let particlesOn = true;
  petalsBtn.classList.remove('off');

  function blossomSVG(color) {
    return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      <g transform="translate(12 12)">
        ${[0,72,144,216,288].map(a => `<ellipse cx="0" cy="-6" rx="3.4" ry="5.2" fill="${color}" opacity="0.92" transform="rotate(${a})"/>`).join('')}
        <circle r="1.6" fill="#fff3a8" opacity="0.95"/>
      </g>
    </svg>`;
  }
  // Real 6-fold snowflakes — three variants (detailed dendrite, simple star, tiny crystal)
  function snowSVG(color, variant) {
    const v = (variant == null) ? Math.floor(Math.random() * 3) : variant;
    if (v === 0) {
      // detailed dendrite: 6 main arms + side branches at 1/3 and 2/3
      const arms = [0, 60, 120].map(a => `
        <g transform="rotate(${a})">
          <line x1="-10" y1="0" x2="10" y2="0"/>
          <line x1="-7" y1="0" x2="-8.5" y2="-2.6"/>
          <line x1="-7" y1="0" x2="-8.5" y2="2.6"/>
          <line x1="7"  y1="0" x2="8.5"  y2="-2.6"/>
          <line x1="7"  y1="0" x2="8.5"  y2="2.6"/>
          <line x1="-3.5" y1="0" x2="-4.8" y2="-1.6"/>
          <line x1="-3.5" y1="0" x2="-4.8" y2="1.6"/>
          <line x1="3.5"  y1="0" x2="4.8"  y2="-1.6"/>
          <line x1="3.5"  y1="0" x2="4.8"  y2="1.6"/>
        </g>`).join('');
      return `<svg viewBox="-12 -12 24 24" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <g stroke="${color}" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.95">
          ${arms}
          <circle r="0.9" fill="${color}" stroke="none"/>
        </g>
      </svg>`;
    } else if (v === 1) {
      // simple stellar: 6 arms with arrowhead tips
      const arms = [0, 60, 120].map(a => `
        <g transform="rotate(${a})">
          <line x1="-9" y1="0" x2="9" y2="0"/>
          <line x1="-9" y1="0" x2="-7" y2="-2"/>
          <line x1="-9" y1="0" x2="-7" y2="2"/>
          <line x1="9"  y1="0" x2="7"  y2="-2"/>
          <line x1="9"  y1="0" x2="7"  y2="2"/>
        </g>`).join('');
      return `<svg viewBox="-12 -12 24 24" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <g stroke="${color}" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.9">
          ${arms}
        </g>
      </svg>`;
    } else {
      // distant crystal — tiny soft point
      return `<svg viewBox="-6 -6 12 12" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <circle r="2" fill="${color}" opacity="0.85"/>
        <circle r="3.5" fill="${color}" opacity="0.18"/>
      </svg>`;
    }
  }
  function leafSVG(color) {
    return `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      <path d="M3 21 C 8 6, 18 4, 22 3 C 21 11, 17 19, 4 22 Z" fill="${color}" opacity="0.85"/>
      <path d="M5 20 C 10 12, 16 7, 21 4" stroke="${color}" stroke-width="0.7" fill="none" opacity="0.5"/>
    </svg>`;
  }
  // Soft romantic drizzle: thin, fading streaks with a glowing droplet at the tip
  function rainSVG(color) {
    const gid = 'rg' + Math.random().toString(36).slice(2, 8);
    return `<svg viewBox="0 0 6 30" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="none">
      <defs>
        <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0"/>
          <stop offset="55%" stop-color="${color}" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="${color}" stop-opacity="0.7"/>
        </linearGradient>
      </defs>
      <line x1="3" y1="0" x2="3" y2="26" stroke="url(#${gid})" stroke-width="0.9" stroke-linecap="round"/>
      <circle cx="3" cy="27" r="1.1" fill="${color}" opacity="0.7"/>
    </svg>`;
  }

  function getThemeColors() {
    const cs = getComputedStyle(document.body);
    return [
      cs.getPropertyValue('--particle-1').trim(),
      cs.getPropertyValue('--particle-2').trim(),
      cs.getPropertyValue('--particle-3').trim()
    ];
  }

  let spawnTimer = null;
  function rebuildParticles() {
    particlesEl.innerHTML = '';
    if (spawnTimer) { clearInterval(spawnTimer); spawnTimer = null; }
    if (!particlesOn) return;

    const kind = currentParticleKind();
    const seasonPalettes = {
      spring: ['#f7c5d3','#fde0ea','#ffd9e4','#f4a3b6','#ffe7c2'],
      summer: ['#e9eef7','#dbe6f2','#f4d7dc','#f6c7d0','#fce4d6','#e8d4e0','#cfe0ef'],
      autumn: ['#c8602e','#e08a3a','#a84a22','#d97a2e','#e8a84a'],
      winter: ['#ffffff','#fafafa','#ffffff','#fcfcfc','#ffffff']
    };
    const summerPetalPalette = ['#f4a3b6','#f6c7d0','#fde0ea','#f7c5d3','#fce4d6'];
    const palette = seasonPalettes[currentSeason()] || getThemeColors();

    function makeOne(initial) {
      const el = document.createElement('div');
      el.className = 'particle';

      const isPetalInRain = (kind === 'rain') && (Math.random() < 0.12);
      let snowVariant = null;
      if (kind === 'snow') {
        const r = Math.random();
        snowVariant = r < 0.45 ? 0 : r < 0.8 ? 1 : 2;
      }

      const w = (kind === 'rain' && !isPetalInRain) ? 1.6 + Math.random() * 1.0 : 0;
      const h = (kind === 'rain' && !isPetalInRain) ? 22 + Math.random() * 24 : 0;
      const size = isPetalInRain      ? 10 + Math.random() * 8
                  : kind === 'rain'   ? 0
                  : kind === 'snow'   ? (snowVariant === 2 ? 5 + Math.random() * 4
                                       : snowVariant === 1 ? 9 + Math.random() * 6
                                       :                     12 + Math.random() * 8)
                  : kind === 'leaf'   ? 18 + Math.random() * 22
                  :                     14 + Math.random() * 18;

      const color = isPetalInRain
        ? summerPetalPalette[Math.floor(Math.random() * summerPetalPalette.length)]
        : palette[Math.floor(Math.random() * palette.length)];

      const svg = isPetalInRain    ? blossomSVG(color)
                : kind === 'leaf'  ? leafSVG(color)
                : kind === 'snow'  ? snowSVG(color, snowVariant)
                : kind === 'rain'  ? null  // rain rendered via gradient div, no SVG
                :                    blossomSVG(color);
      if (svg) el.innerHTML = svg;

      const left = Math.random() * 100;
      const landYPx = 4 + Math.random() * 52;
      const landY = `calc(100vh - ${landYPx.toFixed(1)}px)`;

      const dur = isPetalInRain    ? 13 + Math.random() * 8
                : kind === 'rain'  ? 3.6 + Math.random() * 2.4
                : kind === 'leaf'  ? 14 + Math.random() * 10
                : kind === 'snow'  ? (snowVariant === 0 ? 22 + Math.random() * 12
                                    : snowVariant === 1 ? 18 + Math.random() * 10
                                    :                     14 + Math.random() * 8)
                :                    12 + Math.random() * 10;

      // For initial burst, randomize delay across [-2*dur, 0] so the box opens
      // already populated with both landed and in-flight particles. For ongoing
      // spawns, start fresh from the top.
      const startDelay = initial ? -Math.random() * dur * 2 : 0;

      const sway = (kind === 'rain' && !isPetalInRain) ? '40px'
                 : kind === 'snow'                     ? (Math.random() * 320 - 160) + 'px'
                 :                                       (Math.random() * 240 - 120) + 'px';
      const opacity = isPetalInRain    ? 0.6 + Math.random() * 0.3
                    : kind === 'rain'  ? 0.55 + Math.random() * 0.35
                    : kind === 'snow'  ? (snowVariant === 2 ? 0.5 + Math.random() * 0.3
                                                            : 0.7 + Math.random() * 0.3)
                    :                    0.55 + Math.random() * 0.4;

      if (kind === 'rain' && !isPetalInRain) {
        el.style.cssText = `
          left:${left}vw;
          top:0;
          width:${w}px;
          height:${h}px;
          animation-name:rainfall;
          animation-duration:${dur}s;
          animation-delay:${startDelay}s;
          animation-timing-function:linear;
          animation-iteration-count:1;
          animation-fill-mode:forwards;
          --landY:${landY};
          opacity:${opacity};
          background: linear-gradient(180deg, transparent 0%, ${color} 70%, ${color} 100%);
          border-radius: ${w}px;
          box-shadow: 0 0 3px ${color};
          transform: rotate(6deg);
          filter: blur(0.25px);
        `;
      } else {
        el.style.cssText = `
          left:${left}vw;
          top:0;
          width:${size}px;
          height:${size}px;
          animation-duration:${dur}s;
          animation-delay:${startDelay}s;
          animation-iteration-count:1;
          animation-fill-mode:forwards;
          --sway:${sway};
          --dx0:0px;
          --landY:${landY};
          --maxop:${opacity};
        `;
      }

      // No eviction — landed particles stay forever. The spawner stops once the cap is hit.
      particlesEl.appendChild(el);
    }

    // 1) Initial burst — opens with some landed and some still falling
    const initialN = kind === 'rain' ? 70 : 40;
    for (let i = 0; i < initialN; i++) makeOne(true);

    // 2) Continuous spawn — keeps falling forever, particles pile up without limit.
    const interval = kind === 'rain' ? 220 : 850;
    spawnTimer = setInterval(() => makeOne(false), interval);
  }

  const styleSheet = document.createElement('style');
  styleSheet.textContent = `
    @keyframes rainfall {
      /* drops fall, then settle at a random landing Y inside the grass-strip box and stay there */
      0%   { transform: translate(0, -10vh) rotate(6deg); opacity: 0; }
      15%  { opacity: 1; }
      100% { transform: translate(-4vw, var(--landY, 98vh)) rotate(6deg); opacity: 1; }
    }
  `;
  document.head.appendChild(styleSheet);

  petalsBtn.addEventListener('click', () => {
    particlesOn = !particlesOn;
    petalsBtn.classList.toggle('off', !particlesOn);
    petalsBtn.setAttribute('aria-pressed', String(particlesOn));
    rebuildParticles();
  });

  rebuildParticles();

  /* ===== Grass blades + seasonal piles ===== */
  const grassEl = document.getElementById('grassStrip');
  const leafPileEl = document.getElementById('leafPile');
  const petalPileEl = document.getElementById('petalPile');
  const puddlePileEl = document.getElementById('puddlePile');
  const snowPileEl  = document.getElementById('snowPile');

  // Smoothly varying density profile across width — gives natural "this side is more piled than that"
  function makeProfile(W) {
    const peaks = 5 + Math.floor(Math.random() * 4);
    const profile = [];
    for (let i = 0; i < peaks; i++) {
      profile.push({
        x: (i + 0.4 + Math.random() * 0.4) * W / peaks,
        h: 0.45 + Math.random() * 0.7
      });
    }
    return profile;
  }
  function densityAt(profile, x) {
    let w = 0, sum = 0;
    for (const p of profile) {
      const wi = 1 / (1 + Math.pow((x - p.x) / 100, 2));
      w += wi;
      sum += p.h * wi;
    }
    return sum / w;
  }

  function buildGrass() {
    if (!grassEl) return;
    const density = SEASONS[currentSeason()].grassDensity;
    const W = window.innerWidth;
    const N = Math.floor(W / 9 * density);
    const cs = getComputedStyle(document.body);
    const g1 = cs.getPropertyValue('--ground-1').trim() || '#7ba869';
    const g2 = cs.getPropertyValue('--ground-2').trim() || '#3e6b32';
    const tip = cs.getPropertyValue('--grass-tip').trim() || g1;
    const bloom = cs.getPropertyValue('--bloom').trim() || '#ec8aa8';
    const season = currentSeason();

    let svg = `<svg viewBox="0 0 ${W} 70" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">`;
    for (let i = 0; i < N; i++) {
      const x = Math.random() * W;
      const h = 18 + Math.random() * 34;
      const lean = (Math.random() - 0.5) * 12;
      const fill = Math.random() < 0.4 ? g1 : g2;
      svg += `<path d="M ${x} 70 Q ${x + lean*0.5} ${70-h*0.6} ${x + lean} ${70-h} Q ${x + lean - 1} ${70-h*0.6} ${x-1.6} 70 Z" fill="${fill}"/>`;
      if (Math.random() < 0.35) {
        svg += `<path d="M ${x + lean*0.7} ${70-h*0.7} L ${x+lean} ${70-h}" stroke="${tip}" stroke-width="0.8" fill="none" opacity="0.6"/>`;
      }
      if ((season === 'spring' || season === 'summer') && Math.random() < 0.04) {
        const fy = 70 - h - 2;
        svg += `<g transform="translate(${x+lean} ${fy})">`;
        for (let p = 0; p < 5; p++) {
          svg += `<circle cx="${Math.cos(p*1.2566)*2.2}" cy="${Math.sin(p*1.2566)*2.2}" r="1.6" fill="${bloom}" opacity="0.95"/>`;
        }
        svg += `<circle r="1" fill="#fff3a8"/></g>`;
      }
    }
    svg += `</svg>`;
    grassEl.innerHTML = svg;
  }

  function buildLeafPile() {
    if (!leafPileEl) return;
    const W = window.innerWidth;
    const colors = ['#c8602e','#e08a3a','#a84a22','#d97a2e','#8a4520','#e8a84a'];
    const profile = makeProfile(W);
    let svg = `<svg viewBox="0 0 ${W} 60" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">`;

    // 1) Pre-piled base — leaves carpet the bottom
    for (let i = 0; i < W / 6; i++) {
      const x = Math.random() * W;
      const y = 50 + Math.random() * 8;
      const r = 5 + Math.random() * 8;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse cx="0" cy="0" rx="${r*1.3}" ry="${r*0.65}" fill="${c}"/><line x1="${-r*1.2}" y1="0" x2="${r*1.2}" y2="0" stroke="rgba(0,0,0,0.25)" stroke-width="0.7"/></g>`;
    }
    // 2) Accumulated layer — heavier where the profile peaks
    for (let i = 0; i < W / 10; i++) {
      const x = Math.random() * W;
      const dens = densityAt(profile, x);
      if (Math.random() > dens) continue;
      const y = 44 - 12 * dens + Math.random() * 6;
      const r = 5 + Math.random() * 7;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse cx="0" cy="0" rx="${r*1.3}" ry="${r*0.6}" fill="${c}" opacity="0.9"/><line x1="${-r*1.2}" y1="0" x2="${r*1.2}" y2="0" stroke="rgba(0,0,0,0.2)" stroke-width="0.6"/></g>`;
    }
    // 3) Random leaves caught on grass blades
    for (let i = 0; i < W / 26; i++) {
      const x = Math.random() * W;
      const y = 10 + Math.random() * 24;
      const r = 4 + Math.random() * 5;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse cx="0" cy="0" rx="${r*1.3}" ry="${r*0.55}" fill="${c}" opacity="0.85"/><line x1="${-r*1.2}" y1="0" x2="${r*1.2}" y2="0" stroke="rgba(0,0,0,0.2)" stroke-width="0.5"/></g>`;
    }

    svg += `</svg>`;
    leafPileEl.innerHTML = svg;
  }

  function buildPetalPile() {
    if (!petalPileEl) return;
    const W = window.innerWidth;
    const colors = ['#f7c5d3','#fde0ea','#ffd9e4','#f4a3b6','#e88aa6','#ffe0e8','#ffc0cb'];
    const profile = makeProfile(W);
    let svg = `<svg viewBox="0 0 ${W} 60" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">`;

    // 1) Pre-piled base — always present at the very bottom
    for (let i = 0; i < W / 5; i++) {
      const x = Math.random() * W;
      const y = 50 + Math.random() * 8;
      const r = 2.5 + Math.random() * 3;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<ellipse cx="${x}" cy="${y}" rx="${r * 1.6}" ry="${r * 0.55}" fill="${c}" opacity="${0.8 + Math.random() * 0.2}" transform="rotate(${rot} ${x} ${y})"/>`;
    }
    // 2) Accumulated layer — drifts higher where the profile peaks (looks like falls piled there)
    for (let i = 0; i < W / 8; i++) {
      const x = Math.random() * W;
      const dens = densityAt(profile, x);
      if (Math.random() > dens) continue;
      const y = 44 - 12 * dens + Math.random() * 6;
      const r = 3 + Math.random() * 3;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<ellipse cx="${x}" cy="${y}" rx="${r * 1.5}" ry="${r * 0.55}" fill="${c}" opacity="${0.75 + Math.random() * 0.2}" transform="rotate(${rot} ${x} ${y})"/>`;
    }
    // 3) Hanging on grass — random petals stuck mid-grass
    for (let i = 0; i < W / 26; i++) {
      const x = Math.random() * W;
      const y = 10 + Math.random() * 22;
      const r = 2 + Math.random() * 2;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<ellipse cx="${x}" cy="${y}" rx="${r * 1.4}" ry="${r * 0.5}" fill="${c}" opacity="${0.7 + Math.random() * 0.25}" transform="rotate(${rot} ${x} ${y})"/>`;
    }
    // 4) A few intact 5-petal blossoms scattered on top
    for (let i = 0; i < W / 40; i++) {
      const cx = Math.random() * W;
      const cy = 32 + Math.random() * 18;
      const rot = Math.random() * 360;
      const c = colors[Math.floor(Math.random() * colors.length)];
      svg += `<g transform="translate(${cx} ${cy}) rotate(${rot})">`;
      for (let p = 0; p < 5; p++) {
        svg += `<ellipse cx="0" cy="-2.6" rx="1.9" ry="2.9" fill="${c}" opacity="0.95" transform="rotate(${p * 72})"/>`;
      }
      svg += `<circle r="0.9" fill="#fff3a8"/></g>`;
    }

    svg += `</svg>`;
    petalPileEl.innerHTML = svg;
  }

  function buildPuddlePile() {
    if (!puddlePileEl) return;
    const W = window.innerWidth;
    let svg = `<svg viewBox="0 0 ${W} 60" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="puddle-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stop-color="#a8c8e8" stop-opacity="0"/>
          <stop offset="55%" stop-color="#7ba2c4" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#4f7ea0" stop-opacity="0.85"/>
        </linearGradient>
      </defs>`;
    // Pre-piled wet sheen across the whole strip
    svg += `<rect x="0" y="42" width="${W}" height="18" fill="url(#puddle-grad)" opacity="0.35"/>`;
    // Naturally spaced puddles where rain has collected
    const N = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < N; i++) {
      const cx = (i + 0.5) * W / N + (Math.random() - 0.5) * (W / N) * 0.4;
      const cy = 44 + Math.random() * 10;
      const rx = 70 + Math.random() * 110;
      const ry = 5 + Math.random() * 4;
      svg += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#puddle-grad)" opacity="0.9"/>`;
      svg += `<ellipse cx="${cx - rx * 0.3}" cy="${cy - ry * 0.4}" rx="${rx * 0.4}" ry="${ry * 0.25}" fill="#ffffff" opacity="0.55"/>`;
      svg += `<ellipse cx="${cx + rx * 0.18}" cy="${cy}" rx="${rx * 0.65}" ry="${ry * 0.7}" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.35"/>`;
    }
    // Droplets clinging to grass blades — random "hanging" rain
    for (let i = 0; i < W / 16; i++) {
      const x = Math.random() * W;
      const y = 12 + Math.random() * 26;
      const r = 1.4 + Math.random() * 1.6;
      svg += `<circle cx="${x}" cy="${y}" r="${r}" fill="#7ba2c4" opacity="0.72"/>`;
      svg += `<circle cx="${x - r * 0.3}" cy="${y - r * 0.3}" r="${r * 0.4}" fill="#ffffff" opacity="0.9"/>`;
    }
    svg += `</svg>`;
    puddlePileEl.innerHTML = svg;
  }

  function buildSnowPile() {
    if (!snowPileEl) return;
    const W = window.innerWidth;
    let svg = `<svg viewBox="0 0 ${W} 60" preserveAspectRatio="none" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">`;

    // Just snow caps clinging to grass blades — no bulk drift, so the warm earth shows through
    for (let i = 0; i < W / 12; i++) {
      const x = Math.random() * W;
      const y = 6 + Math.random() * 28;
      const r = 1.6 + Math.random() * 2.2;
      svg += `<ellipse cx="${x}" cy="${y}" rx="${r * 1.3}" ry="${r * 0.7}" fill="#ffffff" opacity="${0.7 + Math.random() * 0.3}"/>`;
    }

    svg += `</svg>`;
    snowPileEl.innerHTML = svg;
  }

  buildGrass();
  buildLeafPile();
  buildPetalPile();
  buildPuddlePile();
  buildSnowPile();
  let _resizeTO;
  window.addEventListener('resize', () => {
    clearTimeout(_resizeTO);
    _resizeTO = setTimeout(() => {
      buildGrass();
      buildLeafPile();
      buildPetalPile();
      buildPuddlePile();
      buildSnowPile();
    }, 200);
  });

  /* ===== Season switching ===== */
  const seasonBtns = document.querySelectorAll('.season-btn');
  function setSeason(s) {
    if (!SEASONS[s]) return;
    body.setAttribute('data-season', s);
    seasonBtns.forEach(b => b.classList.toggle('active', b.dataset.season === s));
    rebuildParticles();
    requestAnimationFrame(() => buildGrass());
    try { localStorage.setItem('letter-season', s); } catch(e){}
  }
  seasonBtns.forEach(b => b.addEventListener('click', () => setSeason(b.dataset.season)));
  try {
    const savedS = localStorage.getItem('letter-season');
    if (savedS && SEASONS[savedS]) setSeason(savedS);
    else setSeason('spring');
  } catch(e){ setSeason('spring'); }

  /* ===== Ambient hum ===== */
  const muteBtn = document.getElementById('muteBtn');
  let audioCtx = null;
  let masterGain = null;
  let humOn = false;
  let oscNodes = [];

  function startHum() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0;
      masterGain.connect(audioCtx.destination);
      const freqs = [110, 164.81, 220];
      oscNodes = freqs.map((f, i) => {
        const o = audioCtx.createOscillator();
        o.type = 'sine';
        o.frequency.value = f;
        const g = audioCtx.createGain();
        g.gain.value = 0.06 - i * 0.015;
        o.connect(g).connect(masterGain);
        const lfo = audioCtx.createOscillator();
        lfo.frequency.value = 0.05 + i * 0.03;
        const lfoG = audioCtx.createGain();
        lfoG.gain.value = 1.2;
        lfo.connect(lfoG).connect(o.frequency);
        o.start(); lfo.start();
        return { o, lfo, g };
      });
      masterGain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 2.2);
      humOn = true;
    } catch(e) { console.warn('audio failed', e); }
  }

  function stopHum() {
    if (!audioCtx || !humOn) return;
    masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
    setTimeout(() => {
      oscNodes.forEach(n => { try{ n.o.stop(); n.lfo.stop(); }catch(e){} });
      oscNodes = [];
      humOn = false;
    }, 850);
  }

  muteBtn.addEventListener('click', () => {
    if (humOn) {
      stopHum();
      muteBtn.classList.add('off');
      muteBtn.setAttribute('aria-pressed','false');
    } else {
      startHum();
      muteBtn.classList.remove('off');
      muteBtn.setAttribute('aria-pressed','true');
    }
  });

  /* ===== Heart burst ===== */
  const burstEl = document.getElementById('burst');
  function heartBurst() {
    const SHAPES = ['♡','✦','❀','❤'];
    for (let i = 0; i < 32; i++) {
      const s = document.createElement('span');
      const angle = Math.random() * Math.PI * 2;
      const dist = 140 + Math.random() * 320;
      s.style.setProperty('--bx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--by', Math.sin(angle) * dist + 'px');
      s.style.setProperty('--br', (Math.random() * 360) + 'deg');
      s.style.fontSize = (16 + Math.random() * 24) + 'px';
      s.style.color = getThemeColors()[Math.floor(Math.random()*3)] || 'currentColor';
      s.textContent = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      burstEl.appendChild(s);
      setTimeout(() => s.remove(), 1700);
    }
  }

  /* ===== "Yes" overlay ===== */
  const yesBtn = document.getElementById('yesBtn');
  const yesOverlay = document.getElementById('yesOverlay');
  const yesClose = document.getElementById('yesClose');
  yesBtn.addEventListener('click', () => {
    heartBurst();
    yesOverlay.classList.add('visible');
    yesOverlay.setAttribute('aria-hidden', 'false');
    setTimeout(heartBurst, 600);
    setTimeout(heartBurst, 1200);
  });
  function closeYes() {
    yesOverlay.classList.remove('visible');
    yesOverlay.setAttribute('aria-hidden', 'true');
  }
  yesOverlay.addEventListener('click', closeYes);
  yesClose.addEventListener('click', (e) => { e.stopPropagation(); closeYes(); });

  /* ===== Keyboard: arrow keys cycle themes ===== */
  const order = ['rose','lavender','sakura','midnight','sage'];
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'Escape' && yesOverlay.classList.contains('visible')) { closeYes(); return; }
    const cur = body.getAttribute('data-theme');
    const idx = order.indexOf(cur);
    if (e.key === 'ArrowRight') setTheme(order[(idx+1) % order.length]);
    else if (e.key === 'ArrowLeft') setTheme(order[(idx-1+order.length) % order.length]);
  });
})(); // end async init IIFE
</script>
</body>
</html>
